<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #111;
            --panel: #1c1c1c;
            --secondary: #333;
            --secondary-hover: #444;
            --text: #fff;
            --muted: #999;
            --border: #383838;
            --accent: #ff9500;
            --special: #a5a5a5;
            --special-text: #000;
        }

        body.light-mode {
            --bg: #f3f3f3;
            --panel: #fff;
            --secondary: #e8e8e8;
            --secondary-hover: #dcdcdc;
            --text: #111;
            --muted: #666;
            --border: #ddd;
            --special: #d5d5d5;
            --special-text: #111;
        }

        html {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            margin: 0;
            width: 100%;
            min-height: 100vh;
            background: var(--bg);
            font-family: Arial, sans-serif;
            color: var(--text);
            padding: 20px;
            overflow-x: hidden;
        }

        button,
        input {
            font-family: inherit;
        }

        .mobile-topbar,
        .sidebar-overlay {
            display: none;
        }

        .app-layout {
            width: 100%;
            max-width: 1380px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 250px minmax(300px, 360px) minmax(0, 1fr);
            gap: 20px;
            align-items: start;
        }

        /* HISTORY */

        .history-panel {
            background: var(--panel);
            border-radius: 28px;
            padding: 16px;
            min-height: 560px;
            border: 1px solid var(--border);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .history-title {
            font-size: 18px;
            font-weight: bold;
        }

        #closeSidebar {
            display: none;
            border: none;
            background: var(--secondary);
            color: var(--text);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
        }

        #newChatButton {
            width: 100%;
            min-height: 44px;
            border: none;
            background: var(--accent);
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #chatSearch {
            width: 100%;
            min-height: 42px;
            border: 1px solid var(--border);
            background: var(--secondary);
            color: var(--text);
            border-radius: 10px;
            padding: 10px;
            font-size: 14px;
            outline: none;
            margin-bottom: 12px;
        }

        #chatHistory {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 6px;
        }

        .history-item {
            border: none;
            background: var(--secondary);
            color: var(--text);
            padding: 11px;
            border-radius: 9px;
            cursor: pointer;
            text-align: left;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .history-item.active {
            outline: 2px solid var(--accent);
        }

        .history-menu-button {
            width: 38px;
            border: none;
            background: var(--secondary);
            color: var(--text);
            border-radius: 9px;
            cursor: pointer;
            font-size: 18px;
        }

        .history-actions {
            grid-column: 1 / -1;
            display: none;
            gap: 6px;
        }

        .history-actions.show {
            display: flex;
        }

        .small-action {
            flex: 1;
            border: none;
            background: var(--secondary);
            color: var(--text);
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
        }

        .delete-action {
            color: #ff6b6b;
        }

        .empty-history {
            color: var(--muted);
            font-size: 14px;
        }

        /* CALCULATOR */

        .calculator {
            background: var(--panel);
            padding: 20px;
            border-radius: 28px;
            border: 1px solid var(--border);
        }

        #display {
            width: 100%;
            height: 100px;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            text-align: right;
            font-size: 42px;
            margin-bottom: 10px;
        }

        #askResultButton {
            width: 100%;
            min-height: 42px;
            border: 1px solid var(--border);
            background: var(--secondary);
            color: var(--text);
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .calc-button {
            aspect-ratio: 1;
            border: none;
            border-radius: 50%;
            background: var(--secondary);
            color: var(--text);
            font-size: 23px;
            cursor: pointer;
        }

        .operator,
        .equal {
            background: var(--accent);
            color: white;
        }

        .special {
            background: var(--special);
            color: var(--special-text);
        }

        .zero {
            grid-column: span 2;
            aspect-ratio: auto;
            border-radius: 40px;
            text-align: left;
            padding-left: 28px;
        }

        /* CHAT */

        .chat-panel {
            background: var(--panel);
            border-radius: 28px;
            padding: 20px;
            min-height: 560px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .chat-title {
            font-size: 20px;
            font-weight: bold;
        }

        .memory-status {
            color: var(--muted);
            font-size: 12px;
            margin-top: 3px;
        }

        .chat-header-buttons {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .header-button {
            border: none;
            background: var(--secondary);
            color: var(--text);
            padding: 9px 11px;
            border-radius: 8px;
            cursor: pointer;
        }

        #chatMessages {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        .new-chat-message {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--muted);
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }

        .message-wrapper.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-wrapper.ai {
            align-self: flex-start;
        }

        .message {
            padding: 11px 13px;
            border-radius: 14px;
            line-height: 1.45;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user-message {
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background: var(--secondary);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        .message-actions {
            display: flex;
            gap: 8px;
            margin-top: 5px;
        }

        .message-action {
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 12px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--muted);
            border-radius: 50%;
            animation: typing 1s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: .15s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: .4;
            }

            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        .chat-input-row {
            display: flex;
            gap: 10px;
        }

        #aiQuestion {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 1px solid var(--border);
            outline: none;
            border-radius: 10px;
            background: var(--secondary);
            color: var(--text);
            font-size: 16px;
        }

        #askButton {
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: white;
            font-weight: bold;
            padding: 13px 18px;
            cursor: pointer;
        }

        #askButton:disabled {
            opacity: .6;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            body {
                padding: 10px;
            }

            .mobile-topbar {
                max-width: 430px;
                margin: 0 auto 12px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            #openSidebar,
            #mobileThemeButton {
                width: 46px;
                height: 46px;
                background: var(--panel);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: 12px;
                cursor: pointer;
            }

            .app-layout {
                grid-template-columns: 1fr;
                max-width: 430px;
            }

            .calculator {
                order: 1;
            }

            .chat-panel {
                order: 2;
            }

            .history-panel {
                position: fixed;
                top: 0;
                left: 0;
                width: min(320px, 86vw);
                height: 100%;
                z-index: 1001;
                border-radius: 0 22px 22px 0;
                transform: translateX(-105%);
                transition: .25s;
                overflow-y: auto;
            }

            .history-panel.open {
                transform: translateX(0);
            }

            #closeSidebar {
                display: block;
            }

            .sidebar-overlay {
                display: block;
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,.55);
                z-index: 1000;
                opacity: 0;
                visibility: hidden;
            }

            .sidebar-overlay.show {
                opacity: 1;
                visibility: visible;
            }

            #desktopThemeButton {
                display: none;
            }

            .message-wrapper {
                max-width: 94%;
            }
        }
    </style>
</head>

<body>

<div class="mobile-topbar">

    <button id="openSidebar">☰</button>

    <strong>AI Calculator</strong>

    <button id="mobileThemeButton">☀</button>

</div>

<div
    class="sidebar-overlay"
    id="sidebarOverlay"
></div>

<div class="app-layout">

    <!-- HISTORY -->

    <div
        class="history-panel"
        id="historyPanel"
    >

        <div class="history-header">

            <div class="history-title">
                Chat History
            </div>

            <button id="closeSidebar">
                ✕
            </button>

        </div>

        <button id="newChatButton">
            + New Chat
        </button>

        <input
            type="text"
            id="chatSearch"
            placeholder="Search chats..."
        >

        <div id="chatHistory"></div>

    </div>


    <!-- CALCULATOR -->

    <div class="calculator">

        <input
            type="text"
            id="display"
            value="0"
            readonly
        >

        <button id="askResultButton">
            Ask AI about result
        </button>

        <div class="buttons">

            <button class="calc-button special" onclick="clearCalculator()">AC</button>
            <button class="calc-button special" onclick="toggleSign()">+/-</button>
            <button class="calc-button special" onclick="percentage()">%</button>
            <button class="calc-button operator" onclick="addOperator('/')">÷</button>

            <button class="calc-button" onclick="addNumber('7')">7</button>
            <button class="calc-button" onclick="addNumber('8')">8</button>
            <button class="calc-button" onclick="addNumber('9')">9</button>
            <button class="calc-button operator" onclick="addOperator('*')">×</button>

            <button class="calc-button" onclick="addNumber('4')">4</button>
            <button class="calc-button" onclick="addNumber('5')">5</button>
            <button class="calc-button" onclick="addNumber('6')">6</button>
            <button class="calc-button operator" onclick="addOperator('-')">−</button>

            <button class="calc-button" onclick="addNumber('1')">1</button>
            <button class="calc-button" onclick="addNumber('2')">2</button>
            <button class="calc-button" onclick="addNumber('3')">3</button>
            <button class="calc-button operator" onclick="addOperator('+')">+</button>

            <button class="calc-button zero" onclick="addNumber('0')">0</button>
            <button class="calc-button" onclick="addDecimal()">.</button>
            <button class="calc-button equal" onclick="calculate()">=</button>

        </div>

    </div>


    <!-- CHAT -->

    <div class="chat-panel">

        <div class="chat-header">

            <div>

                <div
                    class="chat-title"
                    id="chatTitle"
                >
                    New Chat
                </div>

                <div class="memory-status">
                    Conversation memory on
                </div>

            </div>

            <div class="chat-header-buttons">

                <button
                    class="header-button"
                    id="exportChat"
                >
                    Export
                </button>

                <button
                    class="header-button"
                    id="desktopThemeButton"
                >
                    ☀
                </button>

                <button
                    class="header-button"
                    id="clearChat"
                >
                    Clear
                </button>

            </div>

        </div>

        <div id="chatMessages">

            <div class="new-chat-message">
                Start a new chat
            </div>

        </div>

        <div class="chat-input-row">

            <input
                type="text"
                id="aiQuestion"
                placeholder="Ask anything..."
            >

            <button
                id="askButton"
                onclick="askAI()"
            >
                Send
            </button>

        </div>

    </div>

</div>


<script>

    /* ==============================
       CALCULATOR
    ============================== */

    let expression = "";
    let justCalculated = false;
    let latestCalculatorResult = null;

    const display =
        document.getElementById("display");


    function updateDisplay() {

        display.value =
            expression === ""
                ? "0"
                : expression
                    .replace(/\*/g, "×")
                    .replace(/\//g, "÷");
    }


    function addNumber(number) {

        if (justCalculated) {
            expression = "";
            justCalculated = false;
        }

        expression += number;

        latestCalculatorResult = null;

        updateDisplay();
    }


    function addOperator(operator) {

        if (expression === "") {

            if (operator === "-") {
                expression = "-";
                updateDisplay();
            }

            return;
        }

        const last =
            expression.slice(-1);

        if ("+-*/".includes(last)) {
            expression =
                expression.slice(0, -1)
                +
                operator;
        } else {
            expression += operator;
        }

        justCalculated = false;
        latestCalculatorResult = null;

        updateDisplay();
    }


    function addDecimal() {

        if (justCalculated) {
            expression = "";
            justCalculated = false;
        }

        const current =
            expression
                .split(/[+\-*/]/)
                .pop();

        if (current.includes(".")) {
            return;
        }

        if (
            expression === ""
            ||
            "+-*/".includes(
                expression.slice(-1)
            )
        ) {
            expression += "0.";
        } else {
            expression += ".";
        }

        updateDisplay();
    }


    function clearCalculator() {

        expression = "";
        justCalculated = false;
        latestCalculatorResult = null;

        updateDisplay();
    }


    function toggleSign() {

        if (!expression) return;

        const match =
            expression.match(
                /(-?\d*\.?\d+)$/
            );

        if (!match) return;

        const number = match[0];

        const start =
            expression.length
            -
            number.length;

        expression =
            number.startsWith("-")
                ?
                expression.slice(0, start)
                +
                number.slice(1)
                :
                expression.slice(0, start)
                +
                "-"
                +
                number;

        updateDisplay();
    }


    function percentage() {

        if (!expression) return;

        const match =
            expression.match(
                /(-?\d*\.?\d+)$/
            );

        if (!match) return;

        const number =
            parseFloat(match[0]);

        if (isNaN(number)) return;

        expression =
            expression.slice(
                0,
                expression.length
                -
                match[0].length
            )
            +
            (number / 100);

        updateDisplay();
    }


    function calculate() {

        if (!expression) return;

        if (
            "+-*/".includes(
                expression.slice(-1)
            )
        ) {
            return;
        }

        const original =
            expression;

        try {

            if (
                !/^[0-9+\-*/. ]+$/
                    .test(expression)
            ) {
                throw new Error();
            }

            let result =
                Function(
                    '"use strict"; return ('
                    +
                    expression
                    +
                    ')'
                )();

            if (!Number.isFinite(result)) {

                display.value =
                    "Cannot divide by zero";

                expression = "";

                return;
            }

            result =
                Math.round(
                    (result + Number.EPSILON)
                    *
                    10000000000
                )
                /
                10000000000;

            latestCalculatorResult = {
                expression: original,
                result: result
            };

            expression =
                result.toString();

            display.value =
                expression;

            justCalculated =
                true;

        } catch {

            display.value =
                "Error";

            expression = "";

            justCalculated =
                false;
        }
    }



    /* ==============================
       CHAT DATA
    ============================== */

    const chatMessages =
        document.getElementById(
            "chatMessages"
        );

    const chatHistory =
        document.getElementById(
            "chatHistory"
        );

    const chatTitle =
        document.getElementById(
            "chatTitle"
        );

    const chatSearch =
        document.getElementById(
            "chatSearch"
        );

    let currentChatId = null;

    let chats =
        JSON.parse(
            localStorage.getItem(
                "calculatorChats"
            )
            ||
            "[]"
        );


    function generateChatId() {

        return (
            Date.now().toString()
            +
            Math.random()
                .toString(16)
                .slice(2)
        );
    }


    function saveChats() {

        localStorage.setItem(
            "calculatorChats",
            JSON.stringify(chats)
        );
    }


    function createSmartTitle(text) {

        let title =
            text
                .trim()
                .replace(/\s+/g, " ");

        if (title.length > 34) {
            title =
                title.slice(0, 34)
                +
                "...";
        }

        return title || "New Chat";
    }


    function createNewChat(
        firstMessage
    ) {

        const chat = {

            id:
                generateChatId(),

            title:
                createSmartTitle(
                    firstMessage
                ),

            messages: [],

            createdAt:
                new Date()
                    .toISOString()
        };

        chats.unshift(chat);

        currentChatId =
            chat.id;

        saveChats();

        renderHistory();

        return chat;
    }


    function getCurrentChat() {

        return chats.find(
            chat =>
                chat.id
                ===
                currentChatId
        );
    }


    function showNewChatScreen() {

        currentChatId =
            null;

        chatTitle.innerText =
            "New Chat";

        chatMessages.innerHTML =
            '<div class="new-chat-message">Start a new chat</div>';

        document
            .getElementById(
                "aiQuestion"
            )
            .value = "";

        renderHistory();
    }



    /* ==============================
       HISTORY
    ============================== */

    function renderHistory() {

        chatHistory.innerHTML =
            "";

        const term =
            chatSearch.value
                .trim()
                .toLowerCase();

        const filtered =
            chats.filter(chat => {

                if (!term) {
                    return true;
                }

                return (
                    chat.title
                        .toLowerCase()
                        .includes(term)
                    ||
                    chat.messages.some(
                        item =>
                            item.text
                                .toLowerCase()
                                .includes(term)
                    )
                );
            });


        if (
            filtered.length === 0
        ) {

            const empty =
                document.createElement(
                    "div"
                );

            empty.className =
                "empty-history";

            empty.innerText =
                term
                    ?
                    "No matching chats."
                    :
                    "No saved chats yet.";

            chatHistory.appendChild(
                empty
            );

            return;
        }


        filtered.forEach(chat => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "history-row";


            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "history-item";

            if (
                chat.id
                ===
                currentChatId
            ) {
                button
                    .classList
                    .add("active");
            }

            button.innerText =
                chat.title;

            button.addEventListener(
                "click",
                () => {

                    loadSavedChat(
                        chat.id
                    );

                    closeMobileSidebar();
                }
            );


            const menu =
                document.createElement(
                    "button"
                );

            menu.className =
                "history-menu-button";

            menu.innerText = "⋯";


            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "history-actions";


            const rename =
                document.createElement(
                    "button"
                );

            rename.className =
                "small-action";

            rename.innerText =
                "Rename";

            rename.onclick =
                () =>
                    renameChat(
                        chat.id
                    );


            const del =
                document.createElement(
                    "button"
                );

            del.className =
                "small-action delete-action";

            del.innerText =
                "Delete";

            del.onclick =
                () =>
                    deleteChat(
                        chat.id
                    );


            menu.onclick =
                () =>
                    actions
                        .classList
                        .toggle(
                            "show"
                        );


            actions.append(
                rename,
                del
            );

            row.append(
                button,
                menu,
                actions
            );

            chatHistory.appendChild(
                row
            );
        });
    }


    function renameChat(id) {

        const chat =
            chats.find(
                c => c.id === id
            );

        if (!chat) return;

        const name =
            prompt(
                "Enter new chat name:",
                chat.title
            );

        if (
            name === null
            ||
            !name.trim()
        ) {
            return;
        }

        chat.title =
            name.trim()
                .slice(0, 50);

        if (
            currentChatId === id
        ) {
            chatTitle.innerText =
                chat.title;
        }

        saveChats();

        renderHistory();
    }


    function deleteChat(id) {

        const chat =
            chats.find(
                c => c.id === id
            );

        if (!chat) return;

        if (
            !confirm(
                'Delete "'
                +
                chat.title
                +
                '"?'
            )
        ) {
            return;
        }

        chats =
            chats.filter(
                c => c.id !== id
            );

        saveChats();

        if (
            currentChatId === id
        ) {
            showNewChatScreen();
        } else {
            renderHistory();
        }
    }


    function loadSavedChat(id) {

        const chat =
            chats.find(
                c => c.id === id
            );

        if (!chat) return;

        currentChatId = id;

        chatTitle.innerText =
            chat.title;

        chatMessages.innerHTML =
            "";

        chat.messages.forEach(
            item => {

                displayMessage(
                    item.text,
                    item.type,
                    false
                );
            }
        );

        renderHistory();
    }



    /* ==============================
       MESSAGE UI
    ============================== */

    function displayMessage(
        text,
        type,
        shouldSave = true
    ) {

        const welcome =
            chatMessages.querySelector(
                ".new-chat-message"
            );

        if (welcome) {
            welcome.remove();
        }


        const wrapper =
            document.createElement(
                "div"
            );

        wrapper.className =
            "message-wrapper "
            +
            (
                type === "user"
                    ?
                    "user"
                    :
                    "ai"
            );


        const bubble =
            document.createElement(
                "div"
            );

        bubble.className =
            "message "
            +
            (
                type === "user"
                    ?
                    "user-message"
                    :
                    "ai-message"
            );

        bubble.innerText =
            text;

        wrapper.appendChild(
            bubble
        );


        if (
            type === "ai"
        ) {

            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "message-actions";


            const copy =
                document.createElement(
                    "button"
                );

            copy.className =
                "message-action";

            copy.innerText =
                "Copy";

            copy.onclick =
                async () => {

                    await copyText(
                        text
                    );

                    copy.innerText =
                        "Copied";

                    setTimeout(
                        () =>
                            copy.innerText =
                                "Copy",
                        1000
                    );
                };


            const regenerate =
                document.createElement(
                    "button"
                );

            regenerate.className =
                "message-action";

            regenerate.innerText =
                "Regenerate";

            regenerate.onclick =
                regenerateAnswer;


            actions.append(
                copy,
                regenerate
            );

            wrapper.appendChild(
                actions
            );
        }


        chatMessages.appendChild(
            wrapper
        );


        if (shouldSave) {

            let chat =
                getCurrentChat();

            if (!chat) {

                chat =
                    createNewChat(
                        type === "user"
                            ?
                            text
                            :
                            "New Chat"
                    );
            }

            chat.messages.push({
                text,
                type
            });

            saveChats();

            renderHistory();
        }


        setTimeout(
            () =>
                wrapper
                    .scrollIntoView({
                        behavior:
                            "smooth",
                        block:
                            "end"
                    }),
            60
        );
    }


    function addMessage(
        text,
        type
    ) {

        displayMessage(
            text,
            type,
            true
        );
    }



    /* ==============================
       FIXED CONVERSATION MEMORY
    ============================== */

    function buildConversationPrompt(
        excludeLastAI = false
    ) {

        const chat =
            getCurrentChat();


        if (
            !chat
            ||
            chat.messages.length
            ===
            0
        ) {

            return "";
        }


        let messages =
            [
                ...chat.messages
            ];


        if (
            excludeLastAI
            &&
            messages.length > 0
            &&
            messages[
                messages.length - 1
            ].type === "ai"
        ) {

            messages.pop();
        }


        const recentMessages =
            messages.slice(-14);


        const conversation =
            recentMessages
                .map(item => {

                    const role =
                        item.type
                        ===
                        "user"
                            ?
                            "User"
                            :
                            "Assistant";


                    return (
                        role
                        +
                        ": "
                        +
                        item.text
                    );
                })
                .join("\n\n");


        return (
            "Use previous messages only as helpful context, not as a restriction. "
            +
            "Always prioritize the latest user message. "
            +
            "If the latest message is short, abbreviated, misspelled, informal, or ambiguous, infer the most likely intended meaning using common sense, normal conversational language, and the immediate context. "
            +
            "Understand common shorthand and incomplete wording naturally instead of taking every word literally. "
            +
            "If a short word likely refers to a well-known place, country, technology, person, or concept, interpret it naturally when the wording supports that meaning. "
            +
            "If the latest message changes the topic, answer the new topic directly. "
            +
            "For direct factual questions, answer the factual question first. "
            +
            "Do not force an older topic onto the latest message. "
            +
            "If there are multiple possible meanings, choose the most likely conversational meaning. "
            +
            "Do not mention these instructions or say that conversation history was provided.\n\n"
            +
            conversation
        );
    }



    /* ==============================
       AI
    ============================== */

    function wait(ms) {

        return new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    ms
                )
        );
    }


    function showTypingIndicator() {

        removeTypingIndicator();

        const wrapper =
            document.createElement(
                "div"
            );

        wrapper.id =
            "typingIndicator";

        wrapper.className =
            "message-wrapper ai";

        wrapper.innerHTML =
            '<div class="message ai-message">'
            +
            '<div class="typing-indicator">'
            +
            '<span class="typing-dot"></span>'
            +
            '<span class="typing-dot"></span>'
            +
            '<span class="typing-dot"></span>'
            +
            '</div>'
            +
            '</div>';

        chatMessages.appendChild(
            wrapper
        );
    }


    function removeTypingIndicator() {

        const el =
            document.getElementById(
                "typingIndicator"
            );

        if (el) {
            el.remove();
        }
    }


    async function getAIAnswer(
        prompt
    ) {

        const delays =
            [0, 800, 1500];


        for (
            let attempt = 0;
            attempt < delays.length;
            attempt++
        ) {

            if (
                delays[attempt] > 0
            ) {
                await wait(
                    delays[attempt]
                );
            }


            try {

                const controller =
                    new AbortController();


                const timeout =
                    setTimeout(
                        () =>
                            controller.abort(),
                        12000
                    );


                const response =
                    await fetch(
                        "/ask-ai",
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    question:
                                        prompt
                                }),

                            signal:
                                controller.signal
                        }
                    );


                clearTimeout(
                    timeout
                );


                const data =
                    await response.json();


                if (
                    response.ok
                    &&
                    data.answer
                ) {

                    return data.answer;
                }


            } catch (error) {

                console.log(
                    "AI retry:",
                    attempt + 1
                );
            }
        }


        throw new Error(
            "AI unavailable"
        );
    }


    async function askAI() {

        const input =
            document.getElementById(
                "aiQuestion"
            );

        const button =
            document.getElementById(
                "askButton"
            );

        const question =
            input.value.trim();

        if (!question) return;


        addMessage(
            question,
            "user"
        );


        const prompt =
            buildConversationPrompt();


        input.value =
            "";

        button.disabled =
            true;

        button.innerText =
            "Thinking...";

        showTypingIndicator();


        try {

            const answer =
                await getAIAnswer(
                    prompt
                );

            removeTypingIndicator();

            addMessage(
                answer,
                "ai"
            );

        } catch {

            removeTypingIndicator();

            addMessage(
                "AI is temporarily unavailable. Please try again.",
                "ai"
            );
        }


        button.disabled =
            false;

        button.innerText =
            "Send";
    }



    /* ==============================
       REGENERATE
    ============================== */

    async function regenerateAnswer() {

        const chat =
            getCurrentChat();

        if (!chat) return;


        if (
            chat.messages.length
            &&
            chat.messages[
                chat.messages.length - 1
            ].type === "ai"
        ) {

            chat.messages.pop();

            saveChats();

            loadSavedChat(
                chat.id
            );
        }


        const prompt =
            buildConversationPrompt();


        showTypingIndicator();


        try {

            const answer =
                await getAIAnswer(
                    prompt
                );

            removeTypingIndicator();

            addMessage(
                answer,
                "ai"
            );

        } catch {

            removeTypingIndicator();

            addMessage(
                "AI is temporarily unavailable. Please try again.",
                "ai"
            );
        }
    }



    /* ==============================
       COPY
    ============================== */

    async function copyText(text) {

        try {

            await navigator
                .clipboard
                .writeText(
                    text
                );

        } catch {}
    }



    /* ==============================
       ASK AI ABOUT RESULT
    ============================== */

    document
        .getElementById(
            "askResultButton"
        )
        .onclick =
        function () {

            const input =
                document.getElementById(
                    "aiQuestion"
                );


            if (
                latestCalculatorResult
            ) {

                input.value =
                    "Explain this calculation: "
                    +
                    latestCalculatorResult
                        .expression
                    +
                    " = "
                    +
                    latestCalculatorResult
                        .result;

            } else {

                input.value =
                    "Help me with a calculation.";
            }


            input.focus();
        };



    /* ==============================
       EXPORT
    ============================== */

    document
        .getElementById(
            "exportChat"
        )
        .onclick =
        function () {

            const chat =
                getCurrentChat();


            if (
                !chat
                ||
                !chat.messages.length
            ) {

                alert(
                    "There is no chat to export."
                );

                return;
            }


            const content =
                chat.messages
                    .map(item => {

                        return (
                            (
                                item.type
                                ===
                                "user"
                                    ?
                                    "You"
                                    :
                                    "AI"
                            )
                            +
                            ":\n"
                            +
                            item.text
                        );
                    })
                    .join(
                        "\n\n"
                    );


            const blob =
                new Blob(
                    [content],
                    {
                        type:
                            "text/plain"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const a =
                document.createElement(
                    "a"
                );


            a.href = url;

            a.download =
                "chat.txt";

            a.click();

            URL.revokeObjectURL(
                url
            );
        };



    /* ==============================
       THEME
    ============================== */

    if (
        localStorage.getItem(
            "calculatorTheme"
        )
        ===
        "light"
    ) {

        document.body
            .classList
            .add(
                "light-mode"
            );
    }


    function toggleTheme() {

        document.body
            .classList
            .toggle(
                "light-mode"
            );


        const light =
            document.body
                .classList
                .contains(
                    "light-mode"
                );


        localStorage.setItem(
            "calculatorTheme",
            light
                ?
                "light"
                :
                "dark"
        );


        updateThemeButtons();
    }


    function updateThemeButtons() {

        const light =
            document.body
                .classList
                .contains(
                    "light-mode"
                );


        const icon =
            light
                ?
                "☾"
                :
                "☀";


        document
            .getElementById(
                "desktopThemeButton"
            )
            .innerText =
                icon;


        document
            .getElementById(
                "mobileThemeButton"
            )
            .innerText =
                icon;
    }


    document
        .getElementById(
            "desktopThemeButton"
        )
        .onclick =
            toggleTheme;


    document
        .getElementById(
            "mobileThemeButton"
        )
        .onclick =
            toggleTheme;


    updateThemeButtons();



    /* ==============================
       MOBILE SIDEBAR
    ============================== */

    const historyPanel =
        document.getElementById(
            "historyPanel"
        );

    const sidebarOverlay =
        document.getElementById(
            "sidebarOverlay"
        );


    function openMobileSidebar() {

        historyPanel
            .classList
            .add("open");

        sidebarOverlay
            .classList
            .add("show");
    }


    function closeMobileSidebar() {

        historyPanel
            .classList
            .remove("open");

        sidebarOverlay
            .classList
            .remove("show");
    }


    document
        .getElementById(
            "openSidebar"
        )
        .onclick =
            openMobileSidebar;


    document
        .getElementById(
            "closeSidebar"
        )
        .onclick =
            closeMobileSidebar;


    sidebarOverlay.onclick =
        closeMobileSidebar;



    /* ==============================
       BUTTONS
    ============================== */

    document
        .getElementById(
            "newChatButton"
        )
        .onclick =
        function () {

            showNewChatScreen();

            closeMobileSidebar();
        };


    document
        .getElementById(
            "clearChat"
        )
        .onclick =
        function () {

            if (
                currentChatId
            ) {

                deleteChat(
                    currentChatId
                );
            }
        };


    chatSearch.addEventListener(
        "input",
        renderHistory
    );


    document
        .getElementById(
            "aiQuestion"
        )
        .addEventListener(
            "keydown",
            event => {

                if (
                    event.key
                    ===
                    "Enter"
                ) {

                    event.preventDefault();

                    askAI();
                }
            }
        );



    /* ==============================
       KEYBOARD CALCULATOR
    ============================== */

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.target.id
                ===
                "aiQuestion"
                ||
                event.target.id
                ===
                "chatSearch"
            ) {

                return;
            }


            if (
                event.key >= "0"
                &&
                event.key <= "9"
            ) {

                addNumber(
                    event.key
                );
            }

            else if (
                [
                    "+",
                    "-",
                    "*",
                    "/"
                ].includes(
                    event.key
                )
            ) {

                addOperator(
                    event.key
                );
            }

            else if (
                event.key === "."
            ) {

                addDecimal();
            }

            else if (
                event.key === "="
                ||
                event.key === "Enter"
            ) {

                event.preventDefault();

                calculate();
            }

            else if (
                event.key === "Backspace"
            ) {

                expression =
                    expression.slice(
                        0,
                        -1
                    );

                updateDisplay();
            }

            else if (
                event.key === "Escape"
            ) {

                clearCalculator();
            }

            else if (
                event.key === "%"
            ) {

                percentage();
            }
        }
    );



    /* ==============================
       START
    ============================== */

    renderHistory();

    showNewChatScreen();

</script>
