<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            font-family: Arial, sans-serif;
            padding: 20px;
            overflow-x: hidden;
        }

        .calculator {
            width: 100%;
            max-width: 340px;
            background: #1c1c1c;
            padding: 20px;
            border-radius: 28px;
        }

        #display {
            width: 100%;
            height: 100px;
            background: #1c1c1c;
            color: white;
            border: none;
            outline: none;
            font-size: clamp(32px, 8vw, 42px);
            text-align: right;
            padding: 20px 10px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: none;
            border-radius: 50%;
            background: #333;
            color: white;
            font-size: clamp(18px, 5vw, 25px);
            cursor: pointer;
            transition: background 0.15s ease;
        }

        button:hover {
            background: #444;
        }

        .operator,
        .equal {
            background: #ff9500;
        }

        .operator:hover,
        .equal:hover {
            background: #e88900;
        }

        .special {
            background: #a5a5a5;
            color: black;
        }

        .zero {
            grid-column: span 2;
            aspect-ratio: auto;
            border-radius: 35px;
            text-align: left;
            padding-left: 27px;
        }

        @media (max-width: 420px) {
            body {
                padding: 12px;
                align-items: center;
            }

            .calculator {
                max-width: 320px;
                padding: 16px;
                border-radius: 24px;
            }

            #display {
                height: 90px;
                margin-bottom: 12px;
                padding: 15px 8px;
            }

            .buttons {
                gap: 9px;
            }

            .zero {
                padding-left: 22px;
            }
        }

        @media (max-width: 340px) {
            .calculator {
                padding: 12px;
            }

            .buttons {
                gap: 7px;
            }

            #display {
                height: 80px;
            }
        }
    </style>
</head>

<body>

<div class="calculator">

    <form method="POST" id="calculatorForm">

        <input
            type="text"
            id="display"
            name="display"
            value="{{ result if result is not none else '' }}"
            readonly
        >

        <input type="hidden" name="num1" id="num1">
        <input type="hidden" name="num2" id="num2">
        <input type="hidden" name="choice" id="choice">

        <div class="buttons">

            <button type="button" class="special" onclick="clearDisplay()">C</button>
            <button type="button" class="special" onclick="deleteNumber()">⌫</button>
            <button type="button" class="operator" onclick="setOperator('/')">÷</button>
            <button type="button" class="operator" onclick="setOperator('*')">×</button>

            <button type="button" onclick="addNumber('7')">7</button>
            <button type="button" onclick="addNumber('8')">8</button>
            <button type="button" onclick="addNumber('9')">9</button>
            <button type="button" class="operator" onclick="setOperator('-')">−</button>

            <button type="button" onclick="addNumber('4')">4</button>
            <button type="button" onclick="addNumber('5')">5</button>
            <button type="button" onclick="addNumber('6')">6</button>
            <button type="button" class="operator" onclick="setOperator('+')">+</button>

            <button type="button" onclick="addNumber('1')">1</button>
            <button type="button" onclick="addNumber('2')">2</button>
            <button type="button" onclick="addNumber('3')">3</button>

            <button type="button" class="zero" onclick="addNumber('0')">0</button>

            <button type="button" class="equal" onclick="prepareCalculation()">=</button>

        </div>

    </form>

</div>

<script>
    let firstNumber = "";
    let operator = "";
    let currentNumber = "";

    const display = document.getElementById("display");

    function addNumber(number) {
        currentNumber += number;
        display.value = currentNumber;
    }

    function setOperator(op) {
        if (currentNumber === "") {
            return;
        }

        firstNumber = currentNumber;
        operator = op;
        currentNumber = "";

        display.value = firstNumber + " " + op;
    }

    function clearDisplay() {
        firstNumber = "";
        operator = "";
        currentNumber = "";
        display.value = "";
    }

    function deleteNumber() {
        currentNumber = currentNumber.slice(0, -1);
        display.value = currentNumber;
    }

    function prepareCalculation() {
        if (
            firstNumber === "" ||
            currentNumber === "" ||
            operator === ""
        ) {
            return;
        }

        document.getElementById("num1").value = firstNumber;
        document.getElementById("num2").value = currentNumber;
        document.getElementById("choice").value = operator;

        document.getElementById("calculatorForm").submit();
    }
</script>

</body>
</html>
