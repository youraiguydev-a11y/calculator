<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 340px;
            background: #1c1c1c;
            padding: 20px;
            border-radius: 28px;
        }

        #display {
            width: 100%;
            height: 100px;
            background: #1c1c1c;
            color: white;
            border: none;
            outline: none;
            font-size: 42px;
            text-align: right;
            padding: 20px 10px;
            margin-bottom: 15px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 65px;
            border: none;
            border-radius: 50%;
            background: #333;
            color: white;
            font-size: 25px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .operator {
            background: #ff9500;
        }

        .operator:hover {
            background: #e88900;
        }

        .special {
            background: #a5a5a5;
            color: black;
        }

        .zero {
            grid-column: span 2;
            border-radius: 35px;
            text-align: left;
            padding-left: 27px;
        }

        .equal {
            background: #ff9500;
        }
    </style>
</head>

<body>

<div class="calculator">

    <form method="POST">

        <input
            type="text"
            id="display"
            name="display"
            value="{{ result }}"
            readonly
        >

        <input type="hidden" name="num1" id="num1">
        <input type="hidden" name="num2" id="num2">
        <input type="hidden" name="choice" id="choice">

        <div class="buttons">

            <button type="button" class="special" onclick="clearDisplay()">C</button>
            <button type="button" class="special" onclick="deleteNumber()">⌫</button>
            <button type="button" class="operator" onclick="setOperator('/')">÷</button>
            <button type="button" class="operator" onclick="setOperator('*')">×</button>

            <button type="button" onclick="addNumber('7')">7</button>
            <button type="button" onclick="addNumber('8')">8</button>
            <button type="button" onclick="addNumber('9')">9</button>
            <button type="button" class="operator" onclick="setOperator('-')">−</button>

            <button type="button" onclick="addNumber('4')">4</button>
            <button type="button" onclick="addNumber('5')">5</button>
            <button type="button" onclick="addNumber('6')">6</button>
            <button type="button" class="operator" onclick="setOperator('+')">+</button>

            <button type="button" onclick="addNumber('1')">1</button>
            <button type="button" onclick="addNumber('2')">2</button>
            <button type="button" onclick="addNumber('3')">3</button>

            <button type="button" class="zero" onclick="addNumber('0')">0</button>

            <button type="button" class="equal" onclick="prepareCalculation()">=</button>

        </div>

    </form>

</div>

<script>
    let firstNumber = "";
    let operator = "";
    let currentNumber = "";

    function addNumber(number) {
        currentNumber += number;
        document.getElementById("display").value = currentNumber;
    }

    function setOperator(op) {
        if (currentNumber === "") {
            return;
        }

        firstNumber = currentNumber;
        operator = op;
        currentNumber = "";

        document.getElementById("display").value =
            firstNumber + " " + op;
    }

    function clearDisplay() {
        firstNumber = "";
        operator = "";
        currentNumber = "";

        document.getElementById("display").value = "";
    }

    function deleteNumber() {
        currentNumber = currentNumber.slice(0, -1);

        document.getElementById("display").value = currentNumber;
    }

    function prepareCalculation() {

        if (
            firstNumber === "" ||
            currentNumber === "" ||
            operator === ""
        ) {
            return;
        }

        document.getElementById("num1").value = firstNumber;
        document.getElementById("num2").value = currentNumber;
        document.getElementById("choice").value = operator;

        document.querySelector("form").submit();
    }
</script>

</body>
</html>
