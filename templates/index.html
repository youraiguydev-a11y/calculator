<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            font-family: Arial, sans-serif;
            padding: 20px;
            color: white;
        }

        .wrapper {
            width: 100%;
            max-width: 360px;
        }

        .calculator {
            width: 100%;
            background: #1c1c1c;
            padding: 20px;
            border-radius: 28px;
        }

        #display {
            width: 100%;
            height: 100px;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            text-align: right;
            font-size: 42px;
            padding: 15px 5px;
            margin-bottom: 15px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .calc-button {
            width: 100%;
            aspect-ratio: 1;
            border: none;
            border-radius: 50%;
            background: #333;
            color: white;
            font-size: 23px;
            cursor: pointer;
        }

        .operator,
        .equal {
            background: #ff9500;
        }

        .special {
            background: #a5a5a5;
            color: black;
        }

        .zero {
            grid-column: span 2;
            aspect-ratio: auto;
            border-radius: 40px;
            text-align: left;
            padding-left: 28px;
        }

        .ai-section {
            margin-top: 18px;
            width: 100%;
            background: #1c1c1c;
            padding: 18px;
            border-radius: 20px;
        }

        .ai-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        #aiQuestion {
            width: 100%;
            border: none;
            outline: none;
            padding: 13px;
            border-radius: 10px;
            background: #333;
            color: white;
            font-size: 16px;
        }

        #aiQuestion::placeholder {
            color: #aaa;
        }

        #askButton {
            width: 100%;
            border: none;
            margin-top: 10px;
            padding: 13px;
            border-radius: 10px;
            background: #ff9500;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #askButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #aiAnswer {
            margin-top: 14px;
            line-height: 1.5;
            color: #eee;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        @media (max-width: 400px) {
            body {
                padding: 12px;
            }

            .wrapper {
                max-width: 320px;
            }

            .calculator {
                padding: 15px;
            }

            .buttons {
                gap: 9px;
            }

            #display {
                height: 85px;
                font-size: 36px;
            }

            .calc-button {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<div class="wrapper">

    <div class="calculator">

        <input type="text" id="display" readonly value="0">

        <div class="buttons">

            <button class="calc-button special" onclick="clearCalculator()">AC</button>
            <button class="calc-button special" onclick="toggleSign()">+/-</button>
            <button class="calc-button special" onclick="percentage()">%</button>
            <button class="calc-button operator" onclick="addOperator('/')">÷</button>

            <button class="calc-button" onclick="addNumber('7')">7</button>
            <button class="calc-button" onclick="addNumber('8')">8</button>
            <button class="calc-button" onclick="addNumber('9')">9</button>
            <button class="calc-button operator" onclick="addOperator('*')">×</button>

            <button class="calc-button" onclick="addNumber('4')">4</button>
            <button class="calc-button" onclick="addNumber('5')">5</button>
            <button class="calc-button" onclick="addNumber('6')">6</button>
            <button class="calc-button operator" onclick="addOperator('-')">−</button>

            <button class="calc-button" onclick="addNumber('1')">1</button>
            <button class="calc-button" onclick="addNumber('2')">2</button>
            <button class="calc-button" onclick="addNumber('3')">3</button>
            <button class="calc-button operator" onclick="addOperator('+')">+</button>

            <button class="calc-button zero" onclick="addNumber('0')">0</button>
            <button class="calc-button" onclick="addDecimal()">.</button>
            <button class="calc-button equal" onclick="calculate()">=</button>

        </div>

    </div>


    <div class="ai-section">

        <div class="ai-title">Ask AI</div>

        <input
            type="text"
            id="aiQuestion"
            placeholder="Ask a math question..."
        >

        <button id="askButton" onclick="askAI()">
            Ask AI
        </button>

        <div id="aiAnswer"></div>

    </div>

</div>


<script>
    let expression = "";
    let justCalculated = false;

    const display = document.getElementById("display");


    function updateDisplay() {

        if (expression === "") {
            display.value = "0";
            resizeDisplay();
            return;
        }

        display.value = expression
            .replace(/\*/g, "×")
            .replace(/\//g, "÷");

        resizeDisplay();
    }


    function resizeDisplay() {

        const length = display.value.length;

        if (length > 16) {
            display.style.fontSize = "24px";
        }
        else if (length > 11) {
            display.style.fontSize = "30px";
        }
        else {
            display.style.fontSize = "";
        }
    }


    function addNumber(number) {

        if (justCalculated) {
            expression = "";
            justCalculated = false;
        }

        expression += number;

        updateDisplay();
    }


    function addOperator(operator) {

        if (expression === "") {

            if (operator === "-") {
                expression = "-";
                updateDisplay();
            }

            return;
        }

        justCalculated = false;

        const lastCharacter = expression.slice(-1);

        if ("+-*/".includes(lastCharacter)) {
            expression =
                expression.slice(0, -1) + operator;
        }
        else {
            expression += operator;
        }

        updateDisplay();
    }


    function addDecimal() {

        if (justCalculated) {
            expression = "";
            justCalculated = false;
        }

        const currentPart =
            expression.split(/[+\-*/]/).pop();

        if (currentPart.includes(".")) {
            return;
        }

        if (
            expression === "" ||
            "+-*/".includes(expression.slice(-1))
        ) {
            expression += "0.";
        }
        else {
            expression += ".";
        }

        updateDisplay();
    }


    function clearCalculator() {

        expression = "";
        justCalculated = false;

        display.value = "0";
        display.style.fontSize = "";
    }


    function toggleSign() {

        if (expression === "") {
            return;
        }

        const match =
            expression.match(/(-?\d*\.?\d+)$/);

        if (!match) {
            return;
        }

        const number = match[0];
        const start =
            expression.length - number.length;

        if (number.startsWith("-")) {

            expression =
                expression.slice(0, start) +
                number.slice(1);
        }
        else {

            expression =
                expression.slice(0, start) +
                "-" +
                number;
        }

        updateDisplay();
    }


    function percentage() {

        if (expression === "") {
            return;
        }

        const match =
            expression.match(/(-?\d*\.?\d+)$/);

        if (!match) {
            return;
        }

        const number = parseFloat(match[0]);

        if (isNaN(number)) {
            return;
        }

        const percentageValue = number / 100;

        expression =
            expression.slice(
                0,
                expression.length - match[0].length
            ) + percentageValue;

        updateDisplay();
    }


    function calculate() {

        if (expression === "") {
            return;
        }

        const lastCharacter =
            expression.slice(-1);

        if ("+-*/".includes(lastCharacter)) {
            return;
        }

        try {

            if (!/^[0-9+\-*/. ]+$/.test(expression)) {
                throw new Error();
            }

            let result = Function(
                '"use strict"; return (' +
                expression +
                ')'
            )();

            if (!Number.isFinite(result)) {

                display.value =
                    "Cannot divide by zero";

                expression = "";

                resizeDisplay();

                return;
            }

            result =
                Math.round(
                    (result + Number.EPSILON)
                    * 10000000000
                ) / 10000000000;

            expression = result.toString();

            display.value = expression;

            justCalculated = true;

            resizeDisplay();
        }
        catch {

            display.value = "Error";

            expression = "";

            justCalculated = false;
        }
    }


    async function askAI() {

        const questionInput =
            document.getElementById("aiQuestion");

        const answerBox =
            document.getElementById("aiAnswer");

        const askButton =
            document.getElementById("askButton");

        const question =
            questionInput.value.trim();

        if (!question) {

            answerBox.innerText =
                "Please enter a question.";

            return;
        }

        answerBox.innerText = "Thinking...";

        askButton.disabled = true;
        askButton.innerText = "Thinking...";

        try {

            const response =
                await fetch("/ask-ai", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        question: question
                    })
                });


            const data =
                await response.json();


            if (response.ok) {

                answerBox.innerText =
                    data.answer;
            }
            else {

                answerBox.innerText =
                    data.error ||
                    "AI request failed.";
            }

        }
        catch (error) {

            answerBox.innerText =
                "Could not connect to AI.";
        }
        finally {

            askButton.disabled = false;

            askButton.innerText = "Ask AI";
        }
    }


    document
        .getElementById("aiQuestion")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    event.preventDefault();

                    askAI();
                }
            }
        );


    document.addEventListener(
        "keydown",
        function(event) {

            /*
            AI input mein typing karte waqt
            calculator keyboard shortcuts
            activate nahi honge.
            */

            if (
                event.target.tagName === "INPUT" &&
                event.target.id === "aiQuestion"
            ) {
                return;
            }


            if (
                event.key >= "0" &&
                event.key <= "9"
            ) {
                addNumber(event.key);
            }

            else if (
                ["+", "-", "*", "/"]
                    .includes(event.key)
            ) {
                addOperator(event.key);
            }

            else if (event.key === ".") {
                addDecimal();
            }

            else if (
                event.key === "Enter" ||
                event.key === "="
            ) {

                event.preventDefault();

                calculate();
            }

            else if (
                event.key === "Backspace"
            ) {

                expression =
                    expression.slice(0, -1);

                updateDisplay();
            }

            else if (
                event.key === "Escape"
            ) {
                clearCalculator();
            }

            else if (
                event.key === "%"
            ) {
                percentage();
            }
        }
    );
</script>

</body>
</html>
