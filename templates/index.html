<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            font-family: Arial, sans-serif;
            padding: 20px;
            color: white;
        }

        .app-layout {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;
            align-items: start;
        }

        .calculator {
            width: 100%;
            background: #1c1c1c;
            padding: 20px;
            border-radius: 28px;
        }

        #display {
            width: 100%;
            height: 100px;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            text-align: right;
            font-size: 42px;
            padding: 15px 5px;
            margin-bottom: 15px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .calc-button {
            width: 100%;
            aspect-ratio: 1;
            border: none;
            border-radius: 50%;
            background: #333;
            color: white;
            font-size: 23px;
            cursor: pointer;
        }

        .operator,
        .equal {
            background: #ff9500;
        }

        .special {
            background: #a5a5a5;
            color: black;
        }

        .zero {
            grid-column: span 2;
            aspect-ratio: auto;
            border-radius: 40px;
            text-align: left;
            padding-left: 28px;
        }

        .chat-panel {
            background: #1c1c1c;
            border-radius: 28px;
            padding: 20px;
            min-height: 560px;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .chat-title {
            font-size: 20px;
            font-weight: bold;
        }

        #clearChat {
            border: none;
            background: #333;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        #chatMessages {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .message {
            max-width: 85%;
            padding: 11px 13px;
            border-radius: 14px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .user-message {
            align-self: flex-end;
            background: #ff9500;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            align-self: flex-start;
            background: #333;
            color: white;
            border-bottom-left-radius: 4px;
        }

        .chat-input-row {
            display: flex;
            gap: 10px;
        }

        #aiQuestion {
            flex: 1;
            padding: 13px;
            border: none;
            outline: none;
            border-radius: 10px;
            background: #333;
            color: white;
            font-size: 16px;
        }

        #askButton {
            padding: 13px 18px;
            border: none;
            border-radius: 10px;
            background: #ff9500;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #askButton:disabled {
            opacity: 0.6;
        }

        @media (max-width: 760px) {
            .app-layout {
                grid-template-columns: 1fr;
                max-width: 380px;
            }

            .chat-panel {
                min-height: 420px;
            }
        }
    </style>
</head>

<body>

<div class="app-layout">

    <div class="calculator">

        <input type="text" id="display" readonly value="0">

        <div class="buttons">

            <button class="calc-button special" onclick="clearCalculator()">AC</button>
            <button class="calc-button special" onclick="toggleSign()">+/-</button>
            <button class="calc-button special" onclick="percentage()">%</button>
            <button class="calc-button operator" onclick="addOperator('/')">÷</button>

            <button class="calc-button" onclick="addNumber('7')">7</button>
            <button class="calc-button" onclick="addNumber('8')">8</button>
            <button class="calc-button" onclick="addNumber('9')">9</button>
            <button class="calc-button operator" onclick="addOperator('*')">×</button>

            <button class="calc-button" onclick="addNumber('4')">4</button>
            <button class="calc-button" onclick="addNumber('5')">5</button>
            <button class="calc-button" onclick="addNumber('6')">6</button>
            <button class="calc-button operator" onclick="addOperator('-')">−</button>

            <button class="calc-button" onclick="addNumber('1')">1</button>
            <button class="calc-button" onclick="addNumber('2')">2</button>
            <button class="calc-button" onclick="addNumber('3')">3</button>
            <button class="calc-button operator" onclick="addOperator('+')">+</button>

            <button class="calc-button zero" onclick="addNumber('0')">0</button>
            <button class="calc-button" onclick="addDecimal()">.</button>
            <button class="calc-button equal" onclick="calculate()">=</button>

        </div>

    </div>

    <div class="chat-panel">

        <div class="chat-header">
            <div class="chat-title">AI Chat</div>
            <button id="clearChat">Clear Chat</button>
        </div>

        <div id="chatMessages"></div>

        <div class="chat-input-row">
            <input
                type="text"
                id="aiQuestion"
                placeholder="Ask anything..."
            >

            <button id="askButton" onclick="askAI()">
                Send
            </button>
        </div>

    </div>

</div>

<script>
    let expression = "";
    let justCalculated = false;

    const display = document.getElementById("display");
    const chatMessages = document.getElementById("chatMessages");

    function updateDisplay() {
        if (expression === "") {
            display.value = "0";
            return;
        }

        display.value = expression
            .replace(/\*/g, "×")
            .replace(/\//g, "÷");
    }

    function addNumber(number) {
        if (justCalculated) {
            expression = "";
            justCalculated = false;
        }

        expression += number;
        updateDisplay();
    }

    function addOperator(operator) {
        if (expression === "") {
            if (operator === "-") {
                expression = "-";
                updateDisplay();
            }
            return;
        }

        justCalculated = false;

        const lastCharacter = expression.slice(-1);

        if ("+-*/".includes(lastCharacter)) {
            expression = expression.slice(0, -1) + operator;
        } else {
            expression += operator;
        }

        updateDisplay();
    }

    function addDecimal() {
        const currentPart = expression.split(/[+\-*/]/).pop();

        if (currentPart.includes(".")) return;

        if (expression === "" || "+-*/".includes(expression.slice(-1))) {
            expression += "0.";
        } else {
            expression += ".";
        }

        updateDisplay();
    }

    function clearCalculator() {
        expression = "";
        justCalculated = false;
        display.value = "0";
    }

    function toggleSign() {
        if (expression === "") return;

        const match = expression.match(/(-?\d*\.?\d+)$/);

        if (!match) return;

        const number = match[0];
        const start = expression.length - number.length;

        if (number.startsWith("-")) {
            expression =
                expression.slice(0, start) +
                number.slice(1);
        } else {
            expression =
                expression.slice(0, start) +
                "-" +
                number;
        }

        updateDisplay();
    }

    function percentage() {
        if (expression === "") return;

        const match = expression.match(/(-?\d*\.?\d+)$/);

        if (!match) return;

        const number = parseFloat(match[0]);

        expression =
            expression.slice(
                0,
                expression.length - match[0].length
            ) + (number / 100);

        updateDisplay();
    }

    function calculate() {
        if (expression === "") return;

        try {
            if (!/^[0-9+\-*/. ]+$/.test(expression)) {
                throw new Error();
            }

            let result = Function(
                '"use strict"; return (' +
                expression +
                ')'
            )();

            if (!Number.isFinite(result)) {
                display.value = "Cannot divide by zero";
                expression = "";
                return;
            }

            result =
                Math.round(
                    (result + Number.EPSILON)
                    * 10000000000
                ) / 10000000000;

            expression = result.toString();
            display.value = expression;
            justCalculated = true;

        } catch {
            display.value = "Error";
            expression = "";
        }
    }

    function addMessage(text, type) {
        const message = document.createElement("div");

        message.className =
            "message " +
            (type === "user"
                ? "user-message"
                : "ai-message");

        message.innerText = text;

        chatMessages.appendChild(message);

        saveChat();

        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
        });
    }

    function saveChat() {
        localStorage.setItem(
            "calculatorChat",
            chatMessages.innerHTML
        );
    }

    function loadChat() {
        const saved =
            localStorage.getItem("calculatorChat");

        if (saved) {
            chatMessages.innerHTML = saved;
        }
    }

    function wait(ms) {
        return new Promise(resolve =>
            setTimeout(resolve, ms)
        );
    }

    async function askAI() {
        const questionInput =
            document.getElementById("aiQuestion");

        const askButton =
            document.getElementById("askButton");

        const question =
            questionInput.value.trim();

        if (!question) return;

        addMessage(question, "user");

        questionInput.value = "";

        askButton.disabled = true;
        askButton.innerText = "Thinking...";

        const delays = [0, 800, 1500];

        for (
            let attempt = 0;
            attempt < delays.length;
            attempt++
        ) {

            if (delays[attempt] > 0) {
                await wait(delays[attempt]);
            }

            try {
                const controller =
                    new AbortController();

                const timeout =
                    setTimeout(
                        () => controller.abort(),
                        8000
                    );

                const response =
                    await fetch("/ask-ai", {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            question: question
                        }),
                        signal: controller.signal
                    });

                clearTimeout(timeout);

                const data =
                    await response.json();

                if (
                    response.ok &&
                    data.answer
                ) {
                    addMessage(
                        data.answer,
                        "ai"
                    );

                    askButton.disabled = false;
                    askButton.innerText = "Send";

                    return;
                }

            } catch (error) {
                console.log(
                    "AI retry:",
                    attempt + 1
                );
            }
        }

        addMessage(
            "AI is temporarily unavailable. Please try again.",
            "ai"
        );

        askButton.disabled = false;
        askButton.innerText = "Send";
    }

    document
        .getElementById("aiQuestion")
        .addEventListener(
            "keydown",
            function(event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    askAI();
                }
            }
        );

    document
        .getElementById("clearChat")
        .addEventListener(
            "click",
            function() {
                chatMessages.innerHTML = "";
                localStorage.removeItem(
                    "calculatorChat"
                );
            }
        );

    loadChat();
</script>

</body>
</html>
