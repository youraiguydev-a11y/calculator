<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #111;
            --panel: #1c1c1c;
            --secondary: #333;
            --secondary-hover: #444;
            --text: #fff;
            --muted: #999;
            --border: #383838;
            --accent: #ff9500;
            --special: #a5a5a5;
            --special-text: #000;
        }

        body.light-mode {
            --bg: #f3f3f3;
            --panel: #ffffff;
            --secondary: #e8e8e8;
            --secondary-hover: #dcdcdc;
            --text: #111;
            --muted: #666;
            --border: #ddd;
            --accent: #ff9500;
            --special: #d5d5d5;
            --special-text: #111;
        }

        html {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            margin: 0;
            width: 100%;
            min-height: 100vh;
            background: var(--bg);
            font-family: Arial, sans-serif;
            color: var(--text);
            padding: 20px;
            overflow-x: hidden;
            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        button,
        input {
            font-family: inherit;
        }

        .mobile-topbar {
            display: none;
        }

        .sidebar-overlay {
            display: none;
        }

        .app-layout {
            width: 100%;
            max-width: 1380px;
            margin: 0 auto;
            display: grid;
            grid-template-columns:
                250px
                minmax(300px, 360px)
                minmax(0, 1fr);
            gap: 20px;
            align-items: start;
        }

        /* =========================
           HISTORY SIDEBAR
        ========================= */

        .history-panel {
            background: var(--panel);
            border-radius: 28px;
            padding: 16px;
            min-height: 560px;
            border: 1px solid var(--border);
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .history-title {
            font-size: 18px;
            font-weight: bold;
        }

        #closeSidebar {
            display: none;
            border: none;
            background: var(--secondary);
            color: var(--text);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
        }

        #newChatButton {
            width: 100%;
            min-height: 44px;
            border: none;
            background: var(--accent);
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .history-search {
            margin-bottom: 12px;
        }

        #chatSearch {
            width: 100%;
            min-height: 42px;
            border: 1px solid var(--border);
            outline: none;
            background: var(--secondary);
            color: var(--text);
            border-radius: 10px;
            padding: 10px 11px;
            font-size: 14px;
        }

        #chatHistory {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 6px;
            align-items: center;
        }

        .history-item {
            width: 100%;
            border: none;
            text-align: left;
            background: var(--secondary);
            color: var(--text);
            padding: 11px;
            border-radius: 9px;
            cursor: pointer;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            min-height: 42px;
        }

        .history-item:hover {
            background: var(--secondary-hover);
        }

        .history-item.active {
            outline: 2px solid var(--accent);
        }

        .history-menu-button {
            width: 38px;
            height: 38px;
            border: none;
            background: var(--secondary);
            color: var(--text);
            border-radius: 9px;
            cursor: pointer;
            font-size: 18px;
        }

        .history-actions {
            grid-column: 1 / -1;
            display: none;
            gap: 6px;
            padding-bottom: 3px;
        }

        .history-actions.show {
            display: flex;
        }

        .small-action {
            flex: 1;
            border: none;
            background: var(--secondary);
            color: var(--text);
            min-height: 36px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }

        .small-action:hover {
            background: var(--secondary-hover);
        }

        .delete-action {
            color: #ff6b6b;
        }

        .empty-history {
            color: var(--muted);
            font-size: 14px;
            padding: 5px;
        }

        /* =========================
           CALCULATOR
        ========================= */

        .calculator,
        .chat-panel {
            width: 100%;
            min-width: 0;
        }

        .calculator {
            background: var(--panel);
            padding: 20px;
            border-radius: 28px;
            border: 1px solid var(--border);
        }

        #display {
            width: 100%;
            height: 100px;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            text-align: right;
            font-size: 42px;
            padding: 15px 5px;
            margin-bottom: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #askResultButton {
            width: 100%;
            min-height: 42px;
            border: 1px solid var(--border);
            background: var(--secondary);
            color: var(--text);
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
        }

        #askResultButton:hover {
            background: var(--secondary-hover);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .calc-button {
            width: 100%;
            min-width: 0;
            aspect-ratio: 1;
            border: none;
            border-radius: 50%;
            background: var(--secondary);
            color: var(--text);
            font-size: 23px;
            cursor: pointer;
        }

        .operator,
        .equal {
            background: var(--accent);
            color: white;
        }

        .special {
            background: var(--special);
            color: var(--special-text);
        }

        .zero {
            grid-column: span 2;
            aspect-ratio: auto;
            border-radius: 40px;
            text-align: left;
            padding-left: 28px;
        }

        /* =========================
           CHAT
        ========================= */

        .chat-panel {
            background: var(--panel);
            border-radius: 28px;
            padding: 20px;
            min-height: 560px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 15px;
        }

        .chat-title-wrap {
            min-width: 0;
        }

        .chat-title {
            font-size: 20px;
            font-weight: bold;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .memory-status {
            color: var(--muted);
            font-size: 12px;
            margin-top: 3px;
        }

        .chat-header-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 7px;
        }

        .header-button {
            border: none;
            background: var(--secondary);
            color: var(--text);
            padding: 9px 11px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        .header-button:hover {
            background: var(--secondary-hover);
        }

        #chatMessages {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
            min-width: 0;
        }

        .new-chat-message {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--muted);
            font-size: 18px;
            padding: 40px 20px;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }

        .message-wrapper.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-wrapper.ai {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message {
            padding: 11px 13px;
            border-radius: 14px;
            line-height: 1.45;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .user-message {
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background: var(--secondary);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        .message-actions {
            display: flex;
            gap: 6px;
            margin-top: 5px;
            flex-wrap: wrap;
        }

        .message-action {
            border: none;
            background: transparent;
            color: var(--muted);
            padding: 4px 6px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 12px;
        }

        .message-action:hover {
            background: var(--secondary);
            color: var(--text);
        }

        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            min-height: 20px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--muted);
            animation: typingBounce 1.1s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes typingBounce {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        .chat-input-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        #aiQuestion {
            flex: 1;
            min-width: 0;
            width: 100%;
            padding: 13px;
            border: 1px solid var(--border);
            outline: none;
            border-radius: 10px;
            background: var(--secondary);
            color: var(--text);
            font-size: 16px;
        }

        #askButton {
            flex-shrink: 0;
            padding: 13px 18px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #askButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* =========================
           TABLET
        ========================= */

        @media (max-width: 1100px) {

            .app-layout {
                grid-template-columns:
                    210px
                    minmax(280px, 330px)
                    minmax(0, 1fr);

                gap: 14px;
            }

            body {
                padding: 14px;
            }

            .calculator,
            .chat-panel,
            .history-panel {
                padding: 15px;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            body {
                padding: 10px;
            }

            .mobile-topbar {
                width: 100%;
                max-width: 430px;
                margin: 0 auto 12px auto;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
            }

            #openSidebar {
                border: none;
                background: var(--panel);
                color: var(--text);
                width: 46px;
                height: 46px;
                border-radius: 12px;
                font-size: 22px;
                cursor: pointer;
                border: 1px solid var(--border);
            }

            .mobile-title {
                font-size: 18px;
                font-weight: bold;
            }

            #mobileThemeButton {
                border: none;
                background: var(--panel);
                color: var(--text);
                width: 46px;
                height: 46px;
                border-radius: 12px;
                cursor: pointer;
                border: 1px solid var(--border);
            }

            .app-layout {
                grid-template-columns: 1fr;
                max-width: 430px;
                gap: 15px;
            }

            .calculator {
                order: 1;
            }

            .chat-panel {
                order: 2;
                min-height: 430px;
            }

            .history-panel {
                position: fixed;
                top: 0;
                left: 0;
                width: min(320px, 86vw);
                height: 100%;
                min-height: 100%;
                z-index: 1001;
                border-radius: 0 22px 22px 0;
                overflow-y: auto;
                transform: translateX(-105%);
                transition: transform 0.25s ease;
            }

            .history-panel.open {
                transform: translateX(0);
            }

            #closeSidebar {
                display: block;
            }

            .sidebar-overlay {
                display: block;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.55);
                z-index: 1000;
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
                transition: opacity 0.25s ease;
            }

            .sidebar-overlay.show {
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
            }

            #desktopThemeButton {
                display: none;
            }

            #display {
                height: 85px;
                font-size: 36px;
            }

            .buttons {
                gap: 9px;
            }

            .calc-button {
                font-size: 20px;
            }

            .message-wrapper {
                max-width: 92%;
            }

            .chat-header-buttons {
                max-width: 48%;
            }
        }

        @media (max-width: 420px) {

            body {
                padding: 8px;
            }

            .calculator,
            .chat-panel {
                border-radius: 20px;
                padding: 13px;
            }

            #display {
                height: 75px;
                font-size: 31px;
                margin-bottom: 8px;
            }

            .buttons {
                gap: 7px;
            }

            .calc-button {
                font-size: 18px;
            }

            .zero {
                padding-left: 22px;
            }

            .chat-title {
                font-size: 18px;
            }

            .header-button {
                font-size: 11px;
                padding: 8px 8px;
            }

            .chat-input-row {
                gap: 7px;
            }

            #aiQuestion {
                padding: 12px 10px;
                font-size: 16px;
            }

            #askButton {
                padding: 12px 13px;
            }

            .message-wrapper {
                max-width: 95%;
            }

            .message {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<!-- =========================
     MOBILE HEADER
========================= -->

<div class="mobile-topbar">

    <button id="openSidebar">
        ☰
    </button>

    <div class="mobile-title">
        AI Calculator
    </div>

    <button
        id="mobileThemeButton"
        title="Change theme"
    >
        ☀
    </button>

</div>


<div
    class="sidebar-overlay"
    id="sidebarOverlay"
></div>


<div class="app-layout">


    <!-- =========================
         CHAT HISTORY
    ========================= -->

    <div
        class="history-panel"
        id="historyPanel"
    >

        <div class="history-header">

            <div class="history-title">
                Chat History
            </div>

            <button id="closeSidebar">
                ✕
            </button>

        </div>


        <button id="newChatButton">
            + New Chat
        </button>


        <div class="history-search">

            <input
                type="text"
                id="chatSearch"
                placeholder="Search chats..."
            >

        </div>


        <div id="chatHistory"></div>

    </div>


    <!-- =========================
         CALCULATOR
    ========================= -->

    <div class="calculator">

        <input
            type="text"
            id="display"
            readonly
            value="0"
        >


        <button id="askResultButton">
            Ask AI about result
        </button>


        <div class="buttons">

            <button
                class="calc-button special"
                onclick="clearCalculator()"
            >
                AC
            </button>

            <button
                class="calc-button special"
                onclick="toggleSign()"
            >
                +/-
            </button>

            <button
                class="calc-button special"
                onclick="percentage()"
            >
                %
            </button>

            <button
                class="calc-button operator"
                onclick="addOperator('/')"
            >
                ÷
            </button>


            <button
                class="calc-button"
                onclick="addNumber('7')"
            >
                7
            </button>

            <button
                class="calc-button"
                onclick="addNumber('8')"
            >
                8
            </button>

            <button
                class="calc-button"
                onclick="addNumber('9')"
            >
                9
            </button>

            <button
                class="calc-button operator"
                onclick="addOperator('*')"
            >
                ×
            </button>


            <button
                class="calc-button"
                onclick="addNumber('4')"
            >
                4
            </button>

            <button
                class="calc-button"
                onclick="addNumber('5')"
            >
                5
            </button>

            <button
                class="calc-button"
                onclick="addNumber('6')"
            >
                6
            </button>

            <button
                class="calc-button operator"
                onclick="addOperator('-')"
            >
                −
            </button>


            <button
                class="calc-button"
                onclick="addNumber('1')"
            >
                1
            </button>

            <button
                class="calc-button"
                onclick="addNumber('2')"
            >
                2
            </button>

            <button
                class="calc-button"
                onclick="addNumber('3')"
            >
                3
            </button>

            <button
                class="calc-button operator"
                onclick="addOperator('+')"
            >
                +
            </button>


            <button
                class="calc-button zero"
                onclick="addNumber('0')"
            >
                0
            </button>

            <button
                class="calc-button"
                onclick="addDecimal()"
            >
                .
            </button>

            <button
                class="calc-button equal"
                onclick="calculate()"
            >
                =
            </button>

        </div>

    </div>


    <!-- =========================
         AI CHAT
    ========================= -->

    <div class="chat-panel">

        <div class="chat-header">

            <div class="chat-title-wrap">

                <div
                    class="chat-title"
                    id="chatTitle"
                >
                    New Chat
                </div>

                <div class="memory-status">
                    Conversation memory on
                </div>

            </div>


            <div class="chat-header-buttons">

                <button
                    class="header-button"
                    id="exportChat"
                >
                    Export
                </button>

                <button
                    class="header-button"
                    id="desktopThemeButton"
                >
                    ☀
                </button>

                <button
                    class="header-button"
                    id="clearChat"
                >
                    Clear
                </button>

            </div>

        </div>


        <div id="chatMessages">

            <div class="new-chat-message">
                Start a new chat
            </div>

        </div>


        <div class="chat-input-row">

            <input
                type="text"
                id="aiQuestion"
                placeholder="Ask anything..."
            >

            <button
                id="askButton"
                onclick="askAI()"
            >
                Send
            </button>

        </div>

    </div>

</div>


<script>

    /* =====================================================
       CALCULATOR
    ===================================================== */

    let expression = "";

    let justCalculated = false;

    let latestCalculatorResult = null;


    const display =
        document.getElementById(
            "display"
        );


    function updateDisplay() {

        if (
            expression === ""
        ) {

            display.value = "0";

            return;
        }


        display.value =
            expression
                .replace(
                    /\*/g,
                    "×"
                )
                .replace(
                    /\//g,
                    "÷"
                );
    }


    function addNumber(
        number
    ) {

        if (
            justCalculated
        ) {

            expression = "";

            justCalculated = false;
        }


        expression += number;


        latestCalculatorResult =
            null;


        updateDisplay();
    }


    function addOperator(
        operator
    ) {

        if (
            expression === ""
        ) {

            if (
                operator === "-"
            ) {

                expression = "-";

                updateDisplay();
            }

            return;
        }


        justCalculated = false;

        latestCalculatorResult =
            null;


        const lastCharacter =
            expression.slice(-1);


        if (
            "+-*/".includes(
                lastCharacter
            )
        ) {

            expression =
                expression.slice(
                    0,
                    -1
                )
                +
                operator;

        } else {

            expression += operator;
        }


        updateDisplay();
    }


    function addDecimal() {

        if (
            justCalculated
        ) {

            expression = "";

            justCalculated = false;
        }


        const currentPart =
            expression
                .split(
                    /[+\-*/]/
                )
                .pop();


        if (
            currentPart.includes(
                "."
            )
        ) {

            return;
        }


        if (
            expression === ""
            ||
            "+-*/".includes(
                expression.slice(
                    -1
                )
            )
        ) {

            expression += "0.";

        } else {

            expression += ".";
        }


        latestCalculatorResult =
            null;


        updateDisplay();
    }


    function clearCalculator() {

        expression = "";

        justCalculated = false;

        latestCalculatorResult =
            null;

        display.value = "0";
    }


    function toggleSign() {

        if (
            expression === ""
        ) {

            return;
        }


        const match =
            expression.match(
                /(-?\d*\.?\d+)$/
            );


        if (
            !match
        ) {

            return;
        }


        const number =
            match[0];


        const start =
            expression.length
            -
            number.length;


        if (
            number.startsWith(
                "-"
            )
        ) {

            expression =
                expression.slice(
                    0,
                    start
                )
                +
                number.slice(1);

        } else {

            expression =
                expression.slice(
                    0,
                    start
                )
                +
                "-"
                +
                number;
        }


        latestCalculatorResult =
            null;


        updateDisplay();
    }


    function percentage() {

        if (
            expression === ""
        ) {

            return;
        }


        const match =
            expression.match(
                /(-?\d*\.?\d+)$/
            );


        if (
            !match
        ) {

            return;
        }


        const number =
            parseFloat(
                match[0]
            );


        if (
            isNaN(number)
        ) {

            return;
        }


        expression =
            expression.slice(
                0,
                expression.length
                -
                match[0].length
            )
            +
            (
                number / 100
            );


        latestCalculatorResult =
            null;


        updateDisplay();
    }


    function calculate() {

        if (
            expression === ""
        ) {

            return;
        }


        const originalExpression =
            expression;


        const lastCharacter =
            expression.slice(-1);


        if (
            "+-*/".includes(
                lastCharacter
            )
        ) {

            return;
        }


        try {

            if (
                !/^[0-9+\-*/. ]+$/
                    .test(
                        expression
                    )
            ) {

                throw new Error();
            }


            let result =
                Function(
                    '"use strict"; return ('
                    +
                    expression
                    +
                    ')'
                )();


            if (
                !Number.isFinite(
                    result
                )
            ) {

                display.value =
                    "Cannot divide by zero";

                expression = "";

                latestCalculatorResult =
                    null;

                return;
            }


            result =
                Math.round(
                    (
                        result
                        +
                        Number.EPSILON
                    )
                    *
                    10000000000
                )
                /
                10000000000;


            latestCalculatorResult = {

                expression:
                    originalExpression,

                result:
                    result
            };


            expression =
                result.toString();


            display.value =
                expression;


            justCalculated =
                true;


        } catch {

            display.value =
                "Error";

            expression = "";

            latestCalculatorResult =
                null;

            justCalculated =
                false;
        }
    }

    /* =====================================================
       CLEAN AUTOMATIC TITLES
    ===================================================== */

    function createSmartTitle(
        text
    ) {

        let title =
            text
                .trim()
                .replace(
                    /\s+/g,
                    " "
                );


        const lower =
            title.toLowerCase();


        if (
            lower.includes(
                "redis"
            )
        ) {

            return "Redis Discussion";
        }


        if (
            lower.includes(
                "python"
            )
        ) {

            return "Python Help";
        }


        if (
            lower.includes(
                "javascript"
            )
            ||
            lower.includes(
                " js "
            )
        ) {

            return "JavaScript Help";
        }


        if (
            lower.includes(
                "ai agent"
            )
        ) {

            return "AI Agent";
        }


        if (
            lower.includes(
                "calculator"
            )
        ) {

            return "Calculator Help";
        }


        if (
            lower.includes(
                "upwork"
            )
        ) {

            return "Upwork";
        }


        title =
            title
                .replace(
                    /[?!.]+$/g,
                    ""
                );


        if (
            title.length > 34
        ) {

            title =
                title.slice(
                    0,
                    34
                )
                +
                "...";
        }


        return (
            title
            ||
            "New Chat"
        );
    }



    function createNewChat(
        firstMessage
    ) {

        const chat = {

            id:
                generateChatId(),

            title:
                createSmartTitle(
                    firstMessage
                ),

            messages: [],

            createdAt:
                new Date()
                    .toISOString()
        };


        chats.unshift(
            chat
        );


        currentChatId =
            chat.id;


        saveChats();

        renderHistory();


        return chat;
    }


    function getCurrentChat() {

        return chats.find(
            chat =>
                chat.id
                ===
                currentChatId
        );
    }

    function renderHistory() {

        chatHistory.innerHTML =
            "";


        const searchTerm =
            chatSearch.value
                .trim()
                .toLowerCase();


        const filteredChats =
            chats.filter(
                chat => {

                    if (
                        !searchTerm
                    ) {

                        return true;
                    }


                    const titleMatch =
                        (
                            chat.title
                            ||
                            ""
                        )
                            .toLowerCase()
                            .includes(
                                searchTerm
                            );


                    const messageMatch =
                        chat.messages
                            .some(
                                item =>
                                    item.text
                                        .toLowerCase()
                                        .includes(
                                            searchTerm
                                        )
                            );


                    return (
                        titleMatch
                        ||
                        messageMatch
                    );
                }
            );


        if (
            filteredChats.length
            ===
            0
        ) {

            const empty =
                document.createElement(
                    "div"
                );

                "empty-history";


            empty.innerText =
                searchTerm
                    ?
                    "No matching chats."
                    :
                    "No saved chats yet.";

                .appendChild(
                    empty
                );


            return;
        }


        filteredChats.forEach(
            chat => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "history-row";


                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "history-item";


                if (
                    chat.id
                    ===
                    currentChatId
                ) {

                    button
                        .classList
                        .add(
                            "active"
                        );
                }


                button.innerText =
                    chat.title
                    ||
                    "Untitled Chat";


                button.title =

                button
                    .addEventListener(
                        "click",
                        function () {

                            loadSavedChat(
                                chat.id
                            );

                            closeMobileSidebar();
                        }
                    );


                const menuButton =
                    document.createElement(
                        "button"
                    );


                menuButton.className =

    /* =====================================================
       RENAME CHAT
    ===================================================== */

    function renameChat(
        chatId
    ) {

        const chat =
            chats.find(
                item =>
                    item.id
                    ===
                    chatId
            );


        if (
            !chat
        ) {

            return;
        }


        const newName =
            prompt(
                "Enter new chat name:",
                chat.title
            );


        if (
            newName === null
        ) {

            return;
        }


        const cleanName =
            newName.trim();


        if (
            !cleanName
        ) {

            return;
        }


        chat.title =
            cleanName.slice(
                0,
                50
            );


        if (
            currentChatId
            ===
            chat.id
        ) {

            chatTitle.innerText =
                chat.title;
        }


        saveChats();

        renderHistory();
    }



    /* =====================================================
       DELETE INDIVIDUAL CHAT
    ===================================================== */

    function deleteChat(
        chatId
    ) {

        const chat =
            chats.find(
                item =>
                    item.id
                    ===
                    chatId
            );


        if (
            !chat
        ) {

            return;
        }


        const confirmed =
            confirm(
                'Delete "'
                +
                chat.title
                +
                '"?'
            );


        if (
            !confirmed
        ) {

            return;
        }


        chats =
            chats.filter(
                item =>
                    item.id
                    !==
                    chatId
            );


        saveChats();


        if (
            currentChatId
            ===
            chatId
        ) {

            showNewChatScreen();

        } else {

            renderHistory();
        }
    }

        chatId

    /* =====================================================
       COPY ANSWER
    ===================================================== */

    async function copyText(
        text
    ) {

        try {

            if (
                navigator.clipboard
                &&
                window.isSecureContext
            ) {

                await navigator
                    .clipboard
                    .writeText(
                        text
                    );

                return;
            }

        } catch {}


        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            text;


        textarea.style.position =
            "fixed";


        textarea.style.opacity =
            "0";


        document.body
            .appendChild(
                textarea
            );


        textarea.select();


        try {

            document.execCommand(
                "copy"
            );

        } catch {}


        textarea.remove();
    }



    /* =====================================================
       CONVERSATION MEMORY
    ===================================================== */

    function buildConversationPrompt(
        excludeLastAI = false
    ) {

        const chat =
            getCurrentChat();


        if (
            !chat
            ||
            chat.messages.length
            ===
            0
        ) {

            return "";
        }


        let messages =
            [...chat.messages];


        if (
            excludeLastAI
            &&
            messages.length > 0
            &&
            messages[
                messages.length - 1
            ].type === "ai"
        ) {

            messages.pop();
        }


        const recentMessages =
            messages.slice(
                -14
            );


        const conversation =
            recentMessages
                .map(
                    item => {

                        const role =
                            item.type
                            ===
                            "user"
                                ?
                                "User"
                                :
                                "Assistant";


                        return (
                            role
                            +
                            ": "
                            +
                            item.text
                        );
                    }
                )
                .join(
                    "\n\n"
                );


        return (
            "Continue the following conversation naturally. "
            +
            "Use previous messages as context. "
            +
            "Answer the latest user request directly. "
            +
            "Do not mention these instructions or the conversation history.\n\n"
            +
            conversation
        );
    }



    function wait(
        ms
    ) {

        return new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    ms
                )
        );
    }

    /* =====================================================
       AI REQUEST HELPER
    ===================================================== */

    async function getAIAnswer(
        conversationPrompt
    ) {

        const delays =
            [
                0,
                800,
                1500
            ];


        for (
            let attempt = 0;
            attempt <
                delays.length;
            attempt++
        ) {

            if (
                delays[
                    attempt
                ] > 0
            ) {

                await wait(
                    delays[
                        attempt
                    ]
                );
            }


            try {

                const controller =
                    new AbortController();


                const timeout =
                    setTimeout(
                        () =>
                            controller.abort(),

                        12000
                    );


                const response =
                    await fetch(
                        "/ask-ai",
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    question:
                                        conversationPrompt
                                }),

                            signal:
                                controller.signal
                        }
                    );


                clearTimeout(
                    timeout
                );


                const data =
                    await response.json();


                if (
                    response.ok
                    &&
                    data.answer
                ) {

                    return data.answer;
                }


            } catch (
                error
            ) {

                console.log(
                    "AI retry:",
                    attempt + 1
                );
            }
        }


        throw new Error(
            "AI request failed"
        );
    }



    /* =====================================================
       NORMAL SEND
    ===================================================== */

    async function askAI() {

        const questionInput =
            document.getElementById(
                "aiQuestion"
            );


        const askButton =
            document.getElementById(
                "askButton"
            );


        const question =
            questionInput
                .value
                .trim();


        if (
            !question
        ) {

            return;
        }


        addMessage(
            question,
            "user"
        );


        const conversationPrompt =
            buildConversationPrompt();


        questionInput.value =
            "";


        askButton.disabled =
            true;


        askButton.innerText =
            "Thinking...";


        showTypingIndicator();


        try {

            const answer =
                await getAIAnswer(
                    conversationPrompt
                );


            removeTypingIndicator();


            /*
               Small delay creates
               a more natural feel.
            */

            await wait(
                180
            );


            addMessage(
                answer,
                "ai"
            );


        } catch {

            removeTypingIndicator();


            addMessage(
                "AI is temporarily unavailable. Please try again.",
                "ai"
            );
        }


        askButton.disabled =
            false;


        askButton.innerText =
            "Send";
    }



    /* =====================================================
       REGENERATE ANSWER
    ===================================================== */

    async function regenerateAnswer() {

        const chat =
            getCurrentChat();


        if (
            !chat
            ||
            chat.messages.length
            ===
            0
        ) {

            return;
        }


        const askButton =
            document.getElementById(
                "askButton"
            );


        /*
           Remove last AI answer,
           but keep user's last question.
        */

        if (
            chat.messages.length > 0
            &&
            chat.messages[
                chat.messages.length - 1
            ].type === "ai"
        ) {

            chat.messages.pop();


            saveChats();


            loadSavedChat(
                chat.id
            );
        }


        const prompt =
            buildConversationPrompt();


        askButton.disabled =
            true;


        askButton.innerText =
            "Thinking...";


        showTypingIndicator();


        try {

            const answer =
                await getAIAnswer(
                    prompt
                );


            removeTypingIndicator();


            addMessage(
                answer,
                "ai"
            );


        } catch {

            removeTypingIndicator();


            addMessage(
                "AI is temporarily unavailable. Please try again.",
                "ai"
            );
        }


        askButton.disabled =
            false;


        askButton.innerText =
            "Send";
    }

                const content =

                        .map(
                            item => {

                                    item.type
                                    ===
                                    "user"
                                        ?
                                        "You"
                                        :

                                    role
                                    +
                                    ":\n"
                                    +
                                    item.text
                                );
                            }
                        )
                        .join(
                            "\n\n"
                        );


                const blob =
                    new Blob(
                        [
                            chat.title
                            +
                            "\n\n"
                            +
                            content
                        ],
                        {
                            type:
                                "text/plain"
                        }
                    );


                const url =
                    URL.createObjectURL(
                        blob

                const link =
                    document.createElement(
                        "a"

                link.href =

                    (
                        chat.title
                        ||
                        "chat"
                    )
                        .replace(
                            /[^a-z0-9]+/gi,
                            "-"
                        )
                    +
                    ".txt";


                document.body
                    .appendChild(
                        link

                link.click();


                link.remove();


                URL.revokeObjectURL(
                    url

            "openSidebar"
        )
        .addEventListener(
            "click",
            openMobileSidebar
        );


    document
        .getElementById(
            "closeSidebar"
        )
        .addEventListener(
            "click",
            closeMobileSidebar
        );


    sidebarOverlay
        .addEventListener(
            "click",
            closeMobileSidebar
        );



    /* =====================================================
       NEW CHAT
    ===================================================== */

    document
        .getElementById(
            "newChatButton"
        )
        .addEventListener(
            "click",
            function () {

                showNewChatScreen();


                closeMobileSidebar();


                document
                    .getElementById(
                        "aiQuestion"
                    )
                    .focus();
            }
        );



    /* =====================================================
       CLEAR CURRENT CHAT
    ===================================================== */

    document
        .getElementById(
            "clearChat"
        )
        .addEventListener(
            "click",
            function () {

                if (
                    !currentChatId
                ) {

                    showNewChatScreen();

                    return;
                }


                const confirmed =
                    confirm(
                        "Delete this entire chat?"
                    );


                if (
                    !confirmed
                ) {

                    return;
                }


                deleteChat(
                    currentChatId
                );
            }
        );



    /* =====================================================
       SEARCH
    ===================================================== */

    chatSearch
        .addEventListener(
            "input",
            renderHistory
        );



    /* =====================================================
       ENTER TO SEND
    ===================================================== */

    document
        .getElementById(
            "aiQuestion"
        )
        .addEventListener(
            "keydown",
            function (
                event
            ) {

                if (
                    event.key
                    ===
                    "Enter"
                ) {

                    event
                        .preventDefault();


                    askAI();
                }
            }
        );



    /* =====================================================
       KEYBOARD CALCULATOR
    ===================================================== */

    document
        .addEventListener(
            "keydown",
            function (
                event
            ) {

                if (
                    event.target.id
                    ===
                    "aiQuestion"
                    ||
                    event.target.id
                    ===
                    "chatSearch"
                ) {

                    return;
                }


                if (
                    event.key >= "0"
                    &&
                    event.key <= "9"
                ) {

                    addNumber(
                        event.key
                    );
                }


                else if (
                    [
                        "+",
                        "-",
                        "*",
                        "/"
                    ]
                        .includes(
                            event.key
                        )
                ) {

                    addOperator(
                        event.key
                    );
                }


                else if (
                    event.key
                    ===
                    "."
                ) {

                    addDecimal();
                }


                else if (
                    event.key
                    ===
                    "Enter"
                    ||
                    event.key
                    ===
                    "="
                ) {

                    event
                        .preventDefault();


                    calculate();
                }


                else if (
                    event.key
                    ===
                    "Backspace"
                ) {

                    expression =
                        expression.slice(
                            0,
                            -1
                        );


                    latestCalculatorResult =
                        null;


                    updateDisplay();
                }


                else if (
                    event.key
                    ===
                    "Escape"
                ) {

                    clearCalculator();
                }


                else if (
                    event.key
                    ===
                    "%"
                ) {

                    percentage();
                }
            }
        );



    /* =====================================================
       START APP
    ===================================================== */

    renderHistory();


    /*
       Website reopen:
       New Chat starts.

       Old chats remain saved
       in localStorage.
    */

    showNewChatScreen();

</script>

</body>
</html>
