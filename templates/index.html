<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            margin: 0;
            width: 100%;
            min-height: 100vh;
            background: #111;
            font-family: Arial, sans-serif;
            color: white;
            padding: 20px;
            overflow-x: hidden;
        }

        .app-layout {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 240px minmax(300px, 360px) minmax(0, 1fr);
            gap: 20px;
            align-items: start;
        }

        /* CHAT HISTORY */

        .history-panel {
            background: #1c1c1c;
            border-radius: 28px;
            padding: 16px;
            min-height: 560px;
        }

        .history-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        #newChatButton {
            width: 100%;
            border: none;
            background: #ff9500;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }

        #chatHistory {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            width: 100%;
            border: none;
            text-align: left;
            background: #333;
            color: white;
            padding: 11px;
            border-radius: 9px;
            cursor: pointer;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: #444;
        }

        .history-item.active {
            background: #555;
        }

        .empty-history {
            color: #999;
            font-size: 14px;
            padding: 5px;
        }

        /* CALCULATOR */

        .calculator,
        .chat-panel {
            width: 100%;
            min-width: 0;
        }

        .calculator {
            background: #1c1c1c;
            padding: 20px;
            border-radius: 28px;
        }

        #display {
            width: 100%;
            height: 100px;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            text-align: right;
            font-size: 42px;
            padding: 15px 5px;
            margin-bottom: 15px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .calc-button {
            width: 100%;
            min-width: 0;
            aspect-ratio: 1;
            border: none;
            border-radius: 50%;
            background: #333;
            color: white;
            font-size: 23px;
            cursor: pointer;
        }

        .operator,
        .equal {
            background: #ff9500;
        }

        .special {
            background: #a5a5a5;
            color: black;
        }

        .zero {
            grid-column: span 2;
            aspect-ratio: auto;
            border-radius: 40px;
            text-align: left;
            padding-left: 28px;
        }

        /* CHAT */

        .chat-panel {
            background: #1c1c1c;
            border-radius: 28px;
            padding: 20px;
            min-height: 560px;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .chat-title {
            font-size: 20px;
            font-weight: bold;
        }

        #clearChat {
            border: none;
            background: #333;
            color: white;
            padding: 9px 12px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        #chatMessages {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            min-width: 0;
        }

        .new-chat-message {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #888;
            font-size: 18px;
            padding: 40px 20px;
        }

        .message {
            max-width: 85%;
            padding: 11px 13px;
            border-radius: 14px;
            line-height: 1.4;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .user-message {
            align-self: flex-end;
            background: #ff9500;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            align-self: flex-start;
            background: #333;
            color: white;
            border-bottom-left-radius: 4px;
        }

        .chat-input-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        #aiQuestion {
            flex: 1;
            min-width: 0;
            width: 100%;
            padding: 13px;
            border: none;
            outline: none;
            border-radius: 10px;
            background: #333;
            color: white;
            font-size: 16px;
        }

        #askButton {
            flex-shrink: 0;
            padding: 13px 18px;
            border: none;
            border-radius: 10px;
            background: #ff9500;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #askButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* TABLET */

        @media (max-width: 1050px) {
            .app-layout {
                grid-template-columns: 200px minmax(280px, 330px) minmax(0, 1fr);
                gap: 14px;
            }

            body {
                padding: 14px;
            }

            .calculator,
            .chat-panel,
            .history-panel {
                padding: 15px;
            }
        }

        /* MOBILE */

        @media (max-width: 800px) {
            body {
                padding: 10px;
            }

            .app-layout {
                grid-template-columns: 1fr;
                max-width: 430px;
                gap: 15px;
            }

            .calculator {
                order: 1;
            }

            .chat-panel {
                order: 2;
                min-height: 420px;
            }

            .history-panel {
                order: 3;
                min-height: auto;
            }

            #chatHistory {
                max-height: 180px;
                overflow-y: auto;
            }

            #display {
                height: 85px;
                font-size: 36px;
            }

            .buttons {
                gap: 9px;
            }

            .calc-button {
                font-size: 20px;
            }

            .message {
                max-width: 90%;
            }
        }

        @media (max-width: 420px) {
            body {
                padding: 8px;
            }

            .calculator,
            .chat-panel,
            .history-panel {
                border-radius: 20px;
                padding: 13px;
            }

            #display {
                height: 75px;
                font-size: 31px;
                margin-bottom: 10px;
            }

            .buttons {
                gap: 7px;
            }

            .calc-button {
                font-size: 18px;
            }

            .zero {
                padding-left: 22px;
            }

            .chat-title {
                font-size: 18px;
            }

            #clearChat {
                font-size: 12px;
                padding: 8px 9px;
            }

            .chat-input-row {
                gap: 7px;
            }

            #aiQuestion {
                padding: 12px 10px;
                font-size: 16px;
            }

            #askButton {
                padding: 12px 13px;
            }

            .message {
                max-width: 94%;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="app-layout">

    <!-- CHAT HISTORY -->

    <div class="history-panel">

        <div class="history-title">Chat History</div>

        <button id="newChatButton">
            + New Chat
        </button>

        <div id="chatHistory"></div>

    </div>

    <!-- CALCULATOR -->

    <div class="calculator">

        <input type="text" id="display" readonly value="0">

        <div class="buttons">

            <button class="calc-button special" onclick="clearCalculator()">AC</button>
            <button class="calc-button special" onclick="toggleSign()">+/-</button>
            <button class="calc-button special" onclick="percentage()">%</button>
            <button class="calc-button operator" onclick="addOperator('/')">÷</button>

            <button class="calc-button" onclick="addNumber('7')">7</button>
            <button class="calc-button" onclick="addNumber('8')">8</button>
            <button class="calc-button" onclick="addNumber('9')">9</button>
            <button class="calc-button operator" onclick="addOperator('*')">×</button>

            <button class="calc-button" onclick="addNumber('4')">4</button>
            <button class="calc-button" onclick="addNumber('5')">5</button>
            <button class="calc-button" onclick="addNumber('6')">6</button>
            <button class="calc-button operator" onclick="addOperator('-')">−</button>

            <button class="calc-button" onclick="addNumber('1')">1</button>
            <button class="calc-button" onclick="addNumber('2')">2</button>
            <button class="calc-button" onclick="addNumber('3')">3</button>
            <button class="calc-button operator" onclick="addOperator('+')">+</button>

            <button class="calc-button zero" onclick="addNumber('0')">0</button>
            <button class="calc-button" onclick="addDecimal()">.</button>
            <button class="calc-button equal" onclick="calculate()">=</button>

        </div>

    </div>

    <!-- AI CHAT -->

    <div class="chat-panel">

        <div class="chat-header">
            <div class="chat-title" id="chatTitle">New Chat</div>
            <button id="clearChat">Clear Chat</button>
        </div>

        <div id="chatMessages">
            <div class="new-chat-message">
                Start a new chat
            </div>
        </div>

        <div class="chat-input-row">

            <input
                type="text"
                id="aiQuestion"
                placeholder="Ask anything..."
            >

            <button id="askButton" onclick="askAI()">
                Send
            </button>

        </div>

    </div>

</div>

<script>

    /* CALCULATOR */

    let expression = "";
    let justCalculated = false;

    const display = document.getElementById("display");

    function updateDisplay() {
        if (expression === "") {
            display.value = "0";
            return;
        }

        display.value = expression
            .replace(/\*/g, "×")
            .replace(/\//g, "÷");
    }

    function addNumber(number) {
        if (justCalculated) {
            expression = "";
            justCalculated = false;
        }

        expression += number;
        updateDisplay();
    }

    function addOperator(operator) {
        if (expression === "") {
            if (operator === "-") {
                expression = "-";
                updateDisplay();
            }
            return;
        }

        justCalculated = false;

        const lastCharacter = expression.slice(-1);

        if ("+-*/".includes(lastCharacter)) {
            expression = expression.slice(0, -1) + operator;
        } else {
            expression += operator;
        }

        updateDisplay();
    }

    function addDecimal() {
        if (justCalculated) {
            expression = "";
            justCalculated = false;
        }

        const currentPart = expression.split(/[+\-*/]/).pop();

        if (currentPart.includes(".")) {
            return;
        }

        if (
            expression === "" ||
            "+-*/".includes(expression.slice(-1))
        ) {
            expression += "0.";
        } else {
            expression += ".";
        }

        updateDisplay();
    }

    function clearCalculator() {
        expression = "";
        justCalculated = false;
        display.value = "0";
    }

    function toggleSign() {
        if (expression === "") return;

        const match = expression.match(/(-?\d*\.?\d+)$/);

        if (!match) return;

        const number = match[0];
        const start = expression.length - number.length;

        if (number.startsWith("-")) {
            expression =
                expression.slice(0, start) +
                number.slice(1);
        } else {
            expression =
                expression.slice(0, start) +
                "-" +
                number;
        }

        updateDisplay();
    }

    function percentage() {
        if (expression === "") return;

        const match = expression.match(/(-?\d*\.?\d+)$/);

        if (!match) return;

        const number = parseFloat(match[0]);

        if (isNaN(number)) return;

        expression =
            expression.slice(
                0,
                expression.length - match[0].length
            ) + (number / 100);

        updateDisplay();
    }

    function calculate() {
        if (expression === "") return;

        const lastCharacter = expression.slice(-1);

        if ("+-*/".includes(lastCharacter)) {
            return;
        }

        try {
            if (!/^[0-9+\-*/. ]+$/.test(expression)) {
                throw new Error();
            }

            let result = Function(
                '"use strict"; return (' +
                expression +
                ')'
            )();

            if (!Number.isFinite(result)) {
                display.value = "Cannot divide by zero";
                expression = "";
                return;
            }

            result =
                Math.round(
                    (result + Number.EPSILON) *
                    10000000000
                ) / 10000000000;

            expression = result.toString();
            display.value = expression;
            justCalculated = true;

        } catch {
            display.value = "Error";
            expression = "";
            justCalculated = false;
        }
    }


    /* CHAT HISTORY */

    const chatMessages =
        document.getElementById("chatMessages");

    const chatHistory =
        document.getElementById("chatHistory");

    const chatTitle =
        document.getElementById("chatTitle");

    let currentChatId = null;

    let chats = JSON.parse(
        localStorage.getItem("calculatorChats") || "[]"
    );


    function generateChatId() {
        return (
            Date.now().toString() +
            Math.random().toString(16).slice(2)
        );
    }


    function saveChats() {
        localStorage.setItem(
            "calculatorChats",
            JSON.stringify(chats)
        );
    }


    function createNewChat(firstMessage) {

        const chat = {
            id: generateChatId(),

            title:
                firstMessage.length > 32
                    ? firstMessage.slice(0, 32) + "..."
                    : firstMessage,

            messages: [],

            createdAt: new Date().toISOString()
        };

        chats.unshift(chat);

        currentChatId = chat.id;

        saveChats();
        renderHistory();

        return chat;
    }


    function getCurrentChat() {
        return chats.find(
            chat => chat.id === currentChatId
        );
    }


    function showNewChatScreen() {

        currentChatId = null;

        chatTitle.innerText = "New Chat";

        chatMessages.innerHTML =
            '<div class="new-chat-message">Start a new chat</div>';

        document.getElementById("aiQuestion").value = "";

        renderHistory();
    }


    function renderHistory() {

        chatHistory.innerHTML = "";

        if (chats.length === 0) {

            const empty =
                document.createElement("div");

            empty.className = "empty-history";
            empty.innerText = "No saved chats yet.";

            chatHistory.appendChild(empty);

            return;
        }


        chats.forEach(chat => {

            const button =
                document.createElement("button");

            button.className = "history-item";

            if (chat.id === currentChatId) {
                button.classList.add("active");
            }

            button.innerText =
                chat.title || "Untitled Chat";

            button.addEventListener(
                "click",
                function () {
                    loadSavedChat(chat.id);
                }
            );

            chatHistory.appendChild(button);
        });
    }


    function loadSavedChat(chatId) {

        const chat =
            chats.find(
                item => item.id === chatId
            );

        if (!chat) return;

        currentChatId = chat.id;

        chatTitle.innerText =
            chat.title || "AI Chat";

        chatMessages.innerHTML = "";

        chat.messages.forEach(item => {

            displayMessage(
                item.text,
                item.type,
                false
            );
        });

        renderHistory();
    }


    function displayMessage(
        text,
        type,
        shouldSave = true
    ) {

        const welcome =
            chatMessages.querySelector(
                ".new-chat-message"
            );

        if (welcome) {
            welcome.remove();
        }

        const message =
            document.createElement("div");

        message.className =
            "message " +
            (
                type === "user"
                    ? "user-message"
                    : "ai-message"
            );

        message.innerText = text;

        chatMessages.appendChild(message);


        if (shouldSave) {

            let chat = getCurrentChat();

            if (!chat) {

                chat = createNewChat(
                    type === "user"
                        ? text
                        : "New Chat"
                );
            }

            chat.messages.push({
                text: text,
                type: type
            });

            saveChats();
            renderHistory();
        }


        setTimeout(() => {

            message.scrollIntoView({
                behavior: "smooth",
                block: "end"
            });

        }, 100);
    }


    function addMessage(text, type) {
        displayMessage(
            text,
            type,
            true
        );
    }


    function wait(ms) {
        return new Promise(
            resolve =>
                setTimeout(resolve, ms)
        );
    }


    /* AI REQUEST */

    async function askAI() {

        const questionInput =
            document.getElementById("aiQuestion");

        const askButton =
            document.getElementById("askButton");

        const question =
            questionInput.value.trim();

        if (!question) return;


        addMessage(question, "user");

        questionInput.value = "";

        askButton.disabled = true;
        askButton.innerText = "Thinking...";

        const delays = [0, 800, 1500];


        for (
            let attempt = 0;
            attempt < delays.length;
            attempt++
        ) {

            if (delays[attempt] > 0) {
                await wait(delays[attempt]);
            }

            try {

                const controller =
                    new AbortController();

                const timeout =
                    setTimeout(
                        () => controller.abort(),
                        8000
                    );

                const response =
                    await fetch("/ask-ai", {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            question: question
                        }),

                        signal: controller.signal
                    });


                clearTimeout(timeout);


                const data =
                    await response.json();


                if (
                    response.ok &&
                    data.answer
                ) {

                    addMessage(
                        data.answer,
                        "ai"
                    );

                    askButton.disabled = false;
                    askButton.innerText = "Send";

                    return;
                }

            } catch (error) {

                console.log(
                    "AI retry:",
                    attempt + 1
                );
            }
        }


        addMessage(
            "AI is temporarily unavailable. Please try again.",
            "ai"
        );

        askButton.disabled = false;
        askButton.innerText = "Send";
    }


    /* NEW CHAT */

    document
        .getElementById("newChatButton")
        .addEventListener(
            "click",
            function () {

                showNewChatScreen();

                document
                    .getElementById("aiQuestion")
                    .focus();
            }
        );


    /* CLEAR CURRENT CHAT */

    document
        .getElementById("clearChat")
        .addEventListener(
            "click",
            function () {

                if (!currentChatId) {

                    showNewChatScreen();
                    return;
                }

                chats = chats.filter(
                    chat =>
                        chat.id !== currentChatId
                );

                saveChats();

                showNewChatScreen();
            }
        );


    /* ENTER SEND */

    document
        .getElementById("aiQuestion")
        .addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {

                    event.preventDefault();

                    askAI();
                }
            }
        );


    /* KEYBOARD CALCULATOR */

    document.addEventListener(
        "keydown",
        function (event) {

            if (
                event.target.id === "aiQuestion"
            ) {
                return;
            }


            if (
                event.key >= "0" &&
                event.key <= "9"
            ) {

                addNumber(event.key);
            }

            else if (
                ["+", "-", "*", "/"]
                    .includes(event.key)
            ) {

                addOperator(event.key);
            }

            else if (event.key === ".") {

                addDecimal();
            }

            else if (
                event.key === "Enter" ||
                event.key === "="
            ) {

                event.preventDefault();
                calculate();
            }

            else if (
                event.key === "Backspace"
            ) {

                expression =
                    expression.slice(0, -1);

                updateDisplay();
            }

            else if (
                event.key === "Escape"
            ) {

                clearCalculator();
            }

            else if (
                event.key === "%"
            ) {

                percentage();
            }
        }
    );


    /* APP START */

    renderHistory();

    /* IMPORTANT:
       Website dobara open ho
       to hamesha fresh New Chat aaye.
       Purani chats history mein save rahengi.
    */

    showNewChatScreen();

</script>

</body>
</html>
